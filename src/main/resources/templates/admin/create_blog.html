<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title}">
      Flexy Free Bootstrap Admin Template by WrapPixel
    </title>
    <!-- <link
      rel="shortcut icon"
      type="image/png"
      href="/images/logos/favicon.png"
    /> -->
    <link rel="stylesheet" href="/css/styles.min.css" />
    <link
      href="https://cdn.quilljs.com/1.3.6/quill.snow.css"
      rel="stylesheet"
    />

    <style>
      #editor {
        font-size: 18px; /* adjust to what you want */
        line-height: 1.6; /* optional: improve readability */
      }
      #toolbar {
        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <!--  Body Wrapper -->
    <div
      class="page-wrapper"
      id="main-wrapper"
      data-layout="vertical"
      data-navbarbg="skin6"
      data-sidebartype="full"
      data-sidebar-position="fixed"
    >
      <!--  App Topstrip -->
      <!-- Sidebar Start -->
      <aside th:replace="fragments/sidebar :: sidebar"></aside>
      <!--  Sidebar End -->
      <!--  Main wrapper -->
      <div class="body-wrapper">
        <!--  Header Start -->
        <header class="app-header">
          <nav class="navbar navbar-expand-lg navbar-light">
            <ul class="navbar-nav">
              <li class="nav-item d-block d-xl-none">
                <a
                  class="nav-link sidebartoggler"
                  id="headerCollapse"
                  href="javascript:void(0)"
                >
                  <i class="ti ti-menu-2"></i>
                </a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link"
                  href="javascript:void(0)"
                  id="drop1"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <i class="ti ti-bell"></i>
                  <div class="notification bg-primary rounded-circle"></div>
                </a>
                <div
                  class="dropdown-menu dropdown-menu-animate-up"
                  aria-labelledby="drop1"
                >
                  <div class="message-body">
                    <a href="javascript:void(0)" class="dropdown-item"
                      >Item 1</a
                    >
                    <a href="javascript:void(0)" class="dropdown-item"
                      >Item 2</a
                    >
                  </div>
                </div>
              </li>
            </ul>
            <div
              class="navbar-collapse justify-content-end px-0"
              id="navbarNav"
            >
              <ul
                class="navbar-nav flex-row ms-auto align-items-center justify-content-end"
              >
                <li class="nav-item dropdown">
                  <a
                    class="nav-link"
                    href="javascript:void(0)"
                    id="drop2"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    <img
                      src="/images/profile/user-1.jpg"
                      alt=""
                      width="35"
                      height="35"
                      class="rounded-circle"
                    />
                  </a>
                  <div
                    class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                    aria-labelledby="drop2"
                  >
                    <div class="message-body">
                      <a
                        href="javascript:void(0)"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-user fs-6"></i>
                        <p class="mb-0 fs-3">My Profile</p>
                      </a>
                      <a
                        href="javascript:void(0)"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-mail fs-6"></i>
                        <p class="mb-0 fs-3">My Account</p>
                      </a>
                      <a
                        href="javascript:void(0)"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-list-check fs-6"></i>
                        <p class="mb-0 fs-3">My Task</p>
                      </a>
                      <a
                        href="./authentication-login.html"
                        class="btn btn-outline-primary mx-3 mt-2 d-block"
                      >
                        Logout
                      </a>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </nav>
        </header>
        <!--  Header End -->
        <div class="body-wrapper-inner">
          <div class="container-fluid">
            <!--  Row 1 -->
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="d-md-flex align-items-center">
                      <div>
                        <h4 class="card-title">Tạo bài viết mới</h4>
                        <p class="card-subtitle">
                          Bài viết của bạn sẽ được tạo ở đây
                        </p>
                      </div>
                    </div>
                    <div class="card shadow-sm mt-3">
                      <div class="card-body">
                        <form
                          class="row g-3"
                          enctype="multipart/form-data"
                          method="POST"
                          th:action="@{/admin/blog/new-docx}"
                          id="editBlogForm"
                        >
                          <!--Tiêu đề-->
                          <div class="col-md-12">
                            <label for="inputBlogTitle" class="form-label"
                              >Tiêu đề</label
                            >
                            <input
                              name="title"
                              type="text"
                              class="form-control"
                              id="inputBlogTitle"
                              placeholder="Nhập tiêu đề bài viết"
                              required
                            />
                          </div>
                          <!--Chuyên mục-->
                          <div class="col-md-12">
                            <label for="inputBlogCategory" class="form-label"
                              >Chuyên mục</label
                            >
                            <input
                              name="category"
                              type="text"
                              class="form-control"
                              id="inputBlogCategory"
                              placeholder="Nhập chuyên mục bài viết"
                              required
                            />
                          </div>
                          <!--Chương trình-->
                          <div class="col-md-12">
                            <label for="inputBlogProgram" class="form-label"
                              >Chương trình</label
                            >
                            <input
                              name="program"
                              type="text"
                              class="form-control"
                              id="inputBlogProgram"
                              placeholder="Nhập chương trình bài viết"
                              required
                            />
                          </div>
                          <!--Mô tả ngắn-->
                          <div class="col-md-12 mb-3">
                            <label for="excerpt" class="form-label fw-bold"
                              >Mô tả</label
                            >
                            <textarea
                              class="form-control"
                              id="excerpt"
                              name="excerpt"
                              rows="5"
                              placeholder="Nhập mô tả ngắn tại đây..."
                            ></textarea>
                            <div class="form-text text-muted">
                              Mô tả ngắn gọn nội dung chính (tối đa 200 ký tự).
                            </div>
                          </div>
                          <!--Ảnh bìa-->
                          <div class="col-md-12 mb-3">
                            <label
                              for="thumbnailInput"
                              class="form-label fw-bold"
                              >Ảnh bìa</label
                            >
                            <div class="input-group">
                              <input
                                type="file"
                                class="form-control"
                                id="thumbnailInput"
                                name="thumbnail"
                                accept="image/*"
                                aria-describedby="clearBtn"
                              />
                              <button
                                class="btn btn-outline-danger"
                                type="button"
                                id="clearImgBtn"
                                data-target="thumbnailInput"
                              >
                                <i class="bi bi-trash"></i> Bỏ chọn
                              </button>
                            </div>
                            <div class="form-text">
                              Định dạng hỗ trợ: .jpg, .png, .jpeg (Tối đa 5MB)
                            </div>
                          </div>
                          <script>
                            // SỬA LỖI TẠI ĐÂY: Thêm sự kiện chờ DOMContentLoaded
                            document.addEventListener(
                              "DOMContentLoaded",
                              function () {
                                const clearBtn =
                                  document.getElementById("clearImgBtn");
                                const inputField =
                                  document.getElementById("thumbnailInput");

                                // Kiểm tra xem nút có tồn tại không để tránh lỗi
                                if (clearBtn && inputField) {
                                  clearBtn.addEventListener(
                                    "click",
                                    function () {
                                      inputField.value = ""; // Xóa giá trị file
                                      // Reset lại giao diện của input (nếu trình duyệt không tự cập nhật)
                                      inputField.type = "text";
                                      inputField.type = "file";
                                    }
                                  );
                                }
                              }
                            );
                          </script>
                          <!--Docx File-->
                          <div class="col-md-12 mb-3">
                            <label
                              for="docxInputSimple"
                              class="form-label fw-bold"
                              >File DOCX</label
                            >
                            <div class="input-group">
                              <input
                                type="file"
                                class="form-control"
                                id="docxInputSimple"
                                name="file"
                                accept=".docx"
                              />
                              <button
                                class="btn btn-outline-secondary"
                                type="button"
                                id="clearDocxSimple"
                              >
                                Bỏ chọn
                              </button>
                            </div>
                            <div class="form-text">
                              Chỉ chấp nhận file Word (.docx)
                            </div>
                          </div>

                          <script>
                            // Script xử lý nút bỏ chọn cho phương án đơn giản
                            document
                              .getElementById("clearDocxSimple")
                              .addEventListener("click", function () {
                                document.getElementById(
                                  "docxInputSimple"
                                ).value = "";
                              });
                          </script>
                          <!-- Submit -->
                          <div class="col-md-12 text-end">
                            <button type="submit" class="btn btn-success">
                              Preview and Submit
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <!--  Footer -->
          </div>
        </div>
      </div>
    </div>

    <!-- <script src="./assets/libs/jquery/dist/jquery.min.js"></script>
    <script src="./assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/sidebarmenu.js"></script>
    <script src="./assets/js/app.min.js"></script>
    <script src="./assets/libs/apexcharts/dist/apexcharts.min.js"></script>
    <script src="./assets/libs/simplebar/dist/simplebar.js"></script>
    <script src="./assets/js/dashboard.js"></script> -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <!-- Quill Editor-->
    <script>
      const toolbarOptions = [
        ["bold", "italic", "underline", "strike"],
        [{ list: "ordered" }, { list: "bullet" }],
        ["link", "image"],
      ];

      const quill = new Quill("#editor", {
        theme: "snow",
        modules: {
          toolbar: toolbarOptions,
        },
      });
    </script>

    <!--Form submmit-->
    <script>
      // On form submit, copy HTML into hidden input
      document
        .getElementById("editBlogForm")
        .addEventListener("submit", function (e) {
          document.getElementById("hiddenContent").value = quill.root.innerHTML;
        });
    </script>
    2
    <!-- solar icons -->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  </body>
</html>
