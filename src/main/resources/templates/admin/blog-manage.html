<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý blog</title>
    <link rel="stylesheet" th:href="@{/css/blog-admin.css}">
</head>
<body class="page">
<header class="header">
    <h1>Quản lý bài viết blog</h1>
    <p class="meta">Thêm mới và xóa bài viết</p>
</header>

<main class="admin-container">
    <div class="card">
        <div class="actions" style="justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span th:if="${param.deleted}" class="alert success" style="margin:0;">Đã xóa bài viết.</span>
            <a href="/admin/blog/new-docx">
                <button type="button">+ Thêm bài từ DOCX</button>
            </a>
        </div>
        <div th:if="${#lists.isEmpty(posts)}" class="empty">Chưa có bài viết.</div>
        <div th:if="${!#lists.isEmpty(posts)}" class="table-wrapper">
            <table class="table">
                <thead>
                <tr>
                    <th>Tiêu đề</th>
                    <th>Chuyên mục</th>
                    <th>Chương trình</th>
                    <th>Ngày tạo</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="post : ${posts}">
                    <td>
                        <a th:href="@{'/blog/' + ${post.slug}}" th:text="${post.title}">Tiêu đề</a>
                        <div class="muted" th:text="${post.slug}">slug</div>
                    </td>
                    <td th:text="${post.category}">Category</td>
                    <td th:text="${post.program}">Program</td>
                    <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">Ngày</td>
                    <td>
                        <form th:action="@{'/admin/blog/delete/' + ${post.id}}" method="post" th:object="${post}" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" onclick="return confirm('Xóa bài viết này?')" style="background:#b91c1c;color:#fff;">Xóa</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
