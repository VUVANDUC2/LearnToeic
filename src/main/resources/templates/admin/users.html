<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${title}">
      Flexy Free Bootstrap Admin Template by WrapPixel
    </title>
    <link rel="stylesheet" href="/css/styles.min.css" />
  </head>

  <body>
    <!--  Body Wrapper -->
    <div
      class="page-wrapper"
      id="main-wrapper"
      data-layout="vertical"
      data-navbarbg="skin6"
      data-sidebartype="full"
      data-sidebar-position="fixed"
    >
      <!-- Sidebar Start -->
      <aside th:replace="fragments/sidebar :: sidebar"></aside>
      <!--  Sidebar End -->
      <!--  Main wrapper -->
      <div class="body-wrapper">
        <!--  Header Start -->
        <header class="app-header">
          <nav class="navbar navbar-expand-lg navbar-light">
            <ul class="navbar-nav">
              <li class="nav-item d-block d-xl-none">
                <a
                  class="nav-link sidebartoggler"
                  id="headerCollapse"
                  href="javascript:void(0)"
                >
                  <i class="ti ti-menu-2"></i>
                </a>
              </li>
              <li class="nav-item dropdown">
                <a
                  class="nav-link"
                  href="javascript:void(0)"
                  id="drop1"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  <i class="ti ti-bell"></i>
                  <div class="notification bg-primary rounded-circle"></div>
                </a>
                <div
                  class="dropdown-menu dropdown-menu-animate-up"
                  aria-labelledby="drop1"
                >
                  <div class="message-body">
                    <a href="javascript:void(0)" class="dropdown-item">
                      Item 1
                    </a>
                    <a href="javascript:void(0)" class="dropdown-item">
                      Item 2
                    </a>
                  </div>
                </div>
              </li>
            </ul>
            <div
              class="navbar-collapse justify-content-end px-0"
              id="navbarNav"
            >
              <ul
                class="navbar-nav flex-row ms-auto align-items-center justify-content-end"
              >
                <li class="nav-item dropdown">
                  <a
                    class="nav-link"
                    href="javascript:void(0)"
                    id="drop2"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    <img
                      src="/images/profile/user-1.jpg"
                      alt=""
                      width="35"
                      height="35"
                      class="rounded-circle"
                    />
                  </a>
                  <div
                    class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up"
                    aria-labelledby="drop2"
                  >
                    <div class="message-body">
                      <a
                        href="javascript:void(0)"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-user fs-6"></i>
                        <p class="mb-0 fs-3">My Profile</p>
                      </a>
                      <a
                        href="javascript:void(0)"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-mail fs-6"></i>
                        <p class="mb-0 fs-3">My Account</p>
                      </a>
                      <a
                        href="javascript:void(0)"
                        class="d-flex align-items-center gap-2 dropdown-item"
                      >
                        <i class="ti ti-list-check fs-6"></i>
                        <p class="mb-0 fs-3">My Task</p>
                      </a>
                      <a
                        href="./authentication-login.html"
                        class="btn btn-outline-primary mx-3 mt-2 d-block"
                      >
                        Logout
                      </a>
                    </div>
                  </div>
                </li>
              </ul>
            </div>
          </nav>
        </header>
        <!--  Header End -->
        <div class="body-wrapper-inner">
          <div class="container-fluid">
            <div class="row">
              <!--Staring-->
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <form>
                      <div class="input-group">
                        <input
                          name="searchTerm"
                          type="text"
                          class="form-control"
                          placeholder="Search..."
                        />
                        <button class="btn btn-primary" type="submit">
                          Search
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
              <!--Table-->
              <div class="col-12">
                <div class="card">
                  <div class="card-body">
                    <div class="d-md-flex align-items-center">
                      <div>
                        <h4 class="card-title">User List</h4>
                        <p class="card-subtitle">
                          All of your users on your website will be display here
                        </p>
                      </div>
                      <div
                        class="d-flex ms-auto align-items-center gap-2 mt-3 mt-md-0"
                      >
                        <a
                          class="btn btn-primary"
                          href="/admin/create_test"
                          role="button"
                        >
                          New+
                        </a>
                        <select
                          class="form-select theme-select border-0"
                          aria-label="Default select example"
                        >
                          <option value="1">March 2025</option>
                          <option value="2">March 2025</option>
                          <option value="3">March 2025</option>
                        </select>
                      </div>
                    </div>

                    <div class="table-responsive mt-4">
                      <table
                        class="table mb-0 text-nowrap varient-table align-middle fs-3"
                      >
                        <thead>
                          <tr>
                            <th scope="col" class="px-0 text-muted">User</th>
                            <th scope="col" class="px-0 text-muted">
                              Full Name
                            </th>
                            <th scope="col" class="px-0 text-muted">Role</th>
                            <th scope="col" class="px-0 text-muted">Email</th>
                            <th scope="col" class="px-0 text-muted">Gender</th>
                            <th scope="col" class="px-0 text-muted text-end">
                              Actions
                            </th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr th:each="user : ${users}">
                            <td class="px-0">
                              <div class="d-flex align-items-center">
                                <img
                                  src="/images/profile/test.png"
                                  class="rounded-circle"
                                  width="40"
                                  alt="flexy"
                                />
                                <div class="ms-3">
                                  <h6
                                    class="mb-0 fw-bolder"
                                    th:text="${user.getUserId}"
                                  >
                                    Sunil Joshi
                                  </h6>
                                  <span class="text-muted">Id</span>
                                </div>
                              </div>
                            </td>
                            <td class="px-0" th:text="${user.getFullName}">
                              Elite Admin
                            </td>
                            <td class="px-0">
                              <select
                                class="form-select form-select-sm role-select"
                                style="width: 100px"
                                th:data-user-id="${user.getUserId()}"
                              >
                                <option
                                  value="admin"
                                  th:selected="${user.getRole() == 'admin'}"
                                >
                                  Admin
                                </option>
                                <option
                                  value="user"
                                  th:selected="${user.getRole() == 'user'}"
                                >
                                  User
                                </option>
                                <option
                                  value="editor"
                                  th:selected="${user.getRole() == 'editor'}"
                                >
                                  Editor
                                </option>
                              </select>
                            </td>
                            <td
                              class="px-0 text-dark fw-medium"
                              th:text="${user.getEmail()}"
                            >
                              $3.9K
                            </td>
                            <td class="px-0 text-center">
                              <select
                                class="form-select form-select-sm gender-select"
                                style="width: 80px"
                                th:data-user-id="${user.getUserId()}"
                              >
                                <option
                                  value="true"
                                  th:selected="${user.getGender() == true}"
                                >
                                  Male
                                </option>
                                <option
                                  value="false"
                                  th:selected="${user.getGender() == false}"
                                >
                                  Female
                                </option>
                              </select>
                            </td>
                            <td class="px-0 text-end fw-medium">
                              <span class="action-icons active">
                                <!-- <a
                                  th:data-test-id="${user.getUserId}"
                                  href="javascript:void(0)"
                                  class="ps-3 edit-user-btn"
                                >
                                  <i class="ti ti-edit fs-5"></i>
                                </a> -->
                                <button
                                  type="button"
                                  class="btn btn-primary"
                                  data-bs-toggle="modal"
                                  data-bs-target="#editUserModal"
                                >
                                  <i class="ti ti-edit fs-5"></i>
                                </button>
                                <div
                                  class="modal fade"
                                  id="editUserModal"
                                  tabindex="-1"
                                  aria-labelledby="editUserLabel"
                                  aria-hidden="true"
                                >
                                  <div
                                    class="modal-dialog modal-dialog-centered modal-dialog-scrollable"
                                  >
                                    <div class="modal-content">
                                      <div class="modal-header">
                                        <h1
                                          class="modal-title fs-5"
                                          id="editUserLabel"
                                        >
                                          Editing User
                                        </h1>
                                        <button
                                          type="button"
                                          class="btn-close"
                                          data-bs-dismiss="modal"
                                          aria-label="Close"
                                        ></button>
                                      </div>
                                      <div class="modal-body">
                                        <form id="editUserForm">
                                          <div class="mb-3">
                                            <label
                                              for="fullName"
                                              class="form-label d-flex justify-content-start"
                                            >
                                              Full Name
                                            </label>
                                            <input
                                              type="text"
                                              class="form-control"
                                              id="fullName"
                                              name="full_name"
                                              th:value="${user.fullName}"
                                              required
                                            />
                                          </div>
                                          <div class="mb-3">
                                            <label
                                              for="role"
                                              class="form-label d-flex justify-content-start"
                                            >
                                              Role
                                            </label>
                                            <select
                                              class="form-select"
                                              id="role"
                                              name="role"
                                              required
                                            >
                                              <option value="admin">
                                                Admin
                                              </option>
                                              <option value="user">User</option>
                                            </select>
                                          </div>
                                          <div class="mb-3">
                                            <label
                                              for="gender"
                                              class="form-label d-flex justify-content-start"
                                            >
                                              Gender
                                            </label>
                                            <select
                                              class="form-select"
                                              id="gender"
                                              name="gender"
                                              required
                                            >
                                              <option value="1">Male</option>
                                              <option value="2">Female</option>
                                            </select>
                                          </div>
                                        </form>
                                      </div>
                                      <div class="modal-footer">
                                        <button
                                          type="button"
                                          class="btn btn-secondary"
                                          data-bs-dismiss="modal"
                                        >
                                          Close
                                        </button>
                                        <button
                                          type="submit"
                                          class="btn btn-primary"
                                          form="editUserForm"
                                        >
                                          Save changes
                                        </button>
                                      </div>
                                    </div>
                                  </div>
                                </div>
                                <a
                                  th:data-test-id="${user.getUserId}"
                                  href="javascript:void(0)"
                                  class="ps-3 delete-user-btn"
                                >
                                  <i class="ti ti-circle-x fs-5"></i>
                                </a>
                              </span>
                            </td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                  <nav aria-label="Page navigation example">
                    <ul class="pagination justify-content-end me-3">
                      <!-- Previous button -->
                      <li
                        class="page-item"
                        th:classappend="${currentPage == 0} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${currentPage - 1})}"
                          tabindex="-1"
                        >
                          Previous
                        </a>
                      </li>

                      <!-- Page numbers -->
                      <li
                        class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${i})}"
                          th:text="${i + 1}"
                        ></a>
                      </li>

                      <!-- Next button -->
                      <li
                        class="page-item"
                        th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'"
                      >
                        <a
                          class="page-link"
                          th:href="@{/admin/users(page=${currentPage + 1})}"
                        >
                          Next
                        </a>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Scrollable modal -->

    <!-- solar icons -->
    <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
