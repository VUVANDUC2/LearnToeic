    <script>
      // Configuration generator function
      const colorPalette = [
        "rgba(255, 99, 132, 0.7)", // Red
        "rgba(54, 162, 235, 0.7)", // Blue
        "rgba(255, 206, 86, 0.7)", // Yellow
        "rgba(75, 192, 192, 0.7)", // Green
        "rgba(153, 102, 255, 0.7)", // Purple
        "rgba(255, 159, 64, 0.7)", // Orange
        "rgba(199, 199, 199, 0.7)", // Gray
      ];

      // Configuration generator function
      function createChart(
        ctxId,
        chartType,
        chartTitle,
        label, // This is an array (e.g., ["User 1", "User 2", ...])
        data,
        max = 1000
      ) {
        const ctx = document.getElementById(ctxId).getContext("2d");

        // 💡 1. Generate an array of background colors based on the number of labels
        const backgroundColors = label.map(
          (_, index) =>
            colorPalette[index % colorPalette.length].replace(/0.7/g, "0.5") // Use 0.5 transparency
        );

        // 💡 2. Generate an array of border colors (using the same colors with 1.0 opacity)
        const borderColors = label.map(
          (_, index) =>
            colorPalette[index % colorPalette.length].replace(/0.7/g, "1") // Use 1.0 transparency
        );

        const chartData = {
          labels: label,
          datasets: [
            {
              label: "TOEIC Score",
              data: data,
              // 💡 Assign the arrays to backgroundColor and borderColor
              backgroundColor: backgroundColors,
              borderColor: borderColors,
              borderWidth: 1,
            },
          ],
        };

        const config = {
          type: chartType,
          data: chartData,
          options: {
            responsive: true,
            plugins: {
              legend: { position: "top" },
              title: { display: true, text: chartTitle },
            },
            scales: {
              y: {
                beginAtZero: true,
                max: max,
              },
            },
          },
        };
        return new Chart(ctx, config);
      }

      // Create each chart

      createChart(
        "chart2",
        "pie",
        "Amount of people have done a test",
        label2,
        data2
      );
      createChart(
        "chart3",
        "bar",
        "Users that take test the most",
        label3,
        data3,
        100
      );
      createChart("chart4", "bar", "Take per tests", label4, data4, 50);
      createChart("chart5", "line", "Tests taken by month", label5, data5, 30);
      createChart(
        "chart6",
        "polarArea",
        "TOEIC Scores - Chart 6",
        labels,
        scores
      );
    </script>
