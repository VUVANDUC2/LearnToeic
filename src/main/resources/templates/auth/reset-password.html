<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu • LearnToeic</title>
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
  <style>
    body.reset-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 45%),
        radial-gradient(circle at bottom right, #e0f2fe 0, transparent 45%),
        #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .reset-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }
    .reset-title {
      font-weight: 700;
      font-size: 26px;
      margin-bottom: 8px;
      color: #111827;
      text-align: center;
    }
    .reset-sub {
      color: #6b7280;
      text-align: center;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-label {
      font-weight: 600;
      font-size: 13px;
      color: #374151;
    }
    .form-control {
      border-radius: 10px;
      border: 1.5px solid #e5e7eb;
      padding: 11px 12px;
      font-size: 0.95rem;
      box-shadow: none;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.18);
    }
    .btn-reset {
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      background-color: #3b82f6;
      box-shadow: 0 8px 18px rgba(59,130,246,0.35);
      transition: all .2s ease;
    }
    .btn-reset:hover {
      background-color: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(59,130,246,0.45);
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
    }
    .back-link span {
      color: #111827;
      font-weight: 500;
    }
    .back-link:hover span {
      color: #3b82f6;
      text-decoration: underline;
    }
    @media (max-width: 576px) {
      .reset-card {
        margin: 16px;
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body class="reset-page">
<main class="reset-card">
  <h1 class="reset-title">Đặt lại mật khẩu</h1>
  <p class="reset-sub">Nhập mật khẩu mới của bạn bên dưới để hoàn tất quá trình.</p>

  <div th:if="${msg}" class="alert alert-success py-2 mb-3" th:text="${msg}"></div>
  <div th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}"></div>

  <form th:action="@{/auth/reset-password}" method="post" class="reset-form" onsubmit="return validateConfirm()">
    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />
    <input type="hidden" name="token" th:value="${token}">

    <div class="mb-3">
      <label for="password" class="form-label">Mật khẩu mới *</label>
      <input id="password"
             name="password"
             type="password"
             class="form-control"
             placeholder="••••••••"
             minlength="6"
             required>
    </div>

    <div class="mb-4">
      <label for="confirmPassword" class="form-label">Xác nhận mật khẩu *</label>
      <input id="confirmPassword"
             type="password"
             class="form-control"
             placeholder="Nhập lại mật khẩu"
             minlength="6"
             required>
      <div class="invalid-feedback" id="confirmFeedback" style="display:none;">
        Mật khẩu xác nhận không khớp.
      </div>
    </div>

    <button type="submit" class="btn-reset">Cập nhật mật khẩu</button>
  </form>

  <a th:href="@{/auth/login}" class="back-link">
    <i class="bi bi-arrow-left"></i>
    <span>Quay lại đăng nhập</span>
  </a>
</main>

<script>
  function validateConfirm() {
    const pass = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const feedback = document.getElementById('confirmFeedback');
    if (pass !== confirm) {
      feedback.style.display = 'block';
      document.getElementById('confirmPassword').classList.add('is-invalid');
      return false;
    }
    feedback.style.display = 'none';
    document.getElementById('confirmPassword').classList.remove('is-invalid');
    return true;
  }
</script>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
