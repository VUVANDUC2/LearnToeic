<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập • LearnToeic</title>

  <!-- Bootstrap / Icons -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/bootstrap-icons.css}">

  <style>
    /* ===== Nền tổng thể ===== */
    body {
      background: linear-gradient(135deg, #2463eb 0%, #6610f2 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    /* ===== Form card ===== */
    .login-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 480px;
      padding: 60px 50px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    /* ===== Tiêu đề ===== */
    .login-title {
      text-align: center;
      color: #0d6efd;
      font-weight: 700;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    /* ===== Label & Input ===== */
    .form-label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }

    .form-control {
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 1rem;
      border: 1.5px solid #ccc;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 6px rgba(13, 110, 253, 0.3);
    }

    /* ===== Input group (mật khẩu + icon mắt) ===== */
    .input-group {
      border-radius: 10px;
      overflow: hidden;
    }

    .btn-eye {
      border: 1px solid #ced4da;
      border-left: none;
      background: #f8f9fa;
      padding: 0 14px;
      display: flex;
      align-items: center;
      transition: background-color 0.2s ease;
    }

    .btn-eye:hover {
      background-color: #e9ecef;
    }

    /* ===== Nút đăng nhập ===== */
    .btn-login {
      display: block;
      width: 100%;
      background: linear-gradient(90deg, #0d6efd, #6610f2);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      padding: 12px;
      font-size: 1.1rem;
      margin-top: 1.2rem;
      transition: all 0.25s ease;
    }

    .btn-login:hover {
      background: linear-gradient(90deg, #6610f2, #0d6efd);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(13, 110, 253, 0.4);
    }

    /* ===== Link ===== */
    a {
      text-decoration: none;
    }

    a.text-link {
      color: #6610f2;
      font-weight: 500;
    }

    a.text-link:hover {
      text-decoration: underline;
    }

    .register-text {
      text-align: center;
      margin-top: 1.8rem;
      font-size: 0.95rem;
      color: #444;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-card {
        padding: 40px 30px;
      }
      .login-title {
        font-size: 1.6rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="login-card">
      <h2 class="login-title">Đăng nhập</h2>

      <form th:action="@{/auth/login}" method="post" novalidate>
        <!-- Email -->
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input id="email" name="email" type="email" class="form-control"
                 placeholder="nhapemail@gmail.com" required>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label for="password" class="form-label d-flex justify-content-between align-items-center">
            <span>Mật khẩu</span>
            <a class="small text-link" th:href="@{/forgot_password}">Quên mật khẩu?</a>
          </label>
          <div class="input-group">
            <input id="password" name="password" type="password" class="form-control"
                   placeholder="••••••••" required>
            <button type="button" class="btn-eye" id="togglePassword" aria-label="Hiện/ẩn mật khẩu">
              <i class="bi bi-eye" id="togglePasswordIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Đăng nhập</button>
      </form>

      <div class="register-text">
        Chưa có tài khoản?
        <a th:href="@{/auth/signup}" class="text-link">Đăng ký ngay</a>
      </div>
    </div>
  </main>

  <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('togglePassword');
      const icon = document.getElementById('togglePasswordIcon');

      btn.addEventListener('click', function () {
        const isHidden = pwd.type === 'password';
        pwd.type = isHidden ? 'text' : 'password';
        icon.classList.toggle('bi-eye', !isHidden);
        icon.classList.toggle('bi-eye-slash', isHidden);
      });
    });
  </script>
</body>
</html>
