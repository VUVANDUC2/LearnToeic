<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Đăng nhập • LearnToeic</title>

    <!-- Bootstrap / Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
  </head>

  <body class="login-page">
    <main class="login-page-wrapper">
      <!-- CỘT TRÁI -->
      <section class="login-hero">
        <div class="login-hero-logo">
          <div class="logo-mark">L</div>
          <div class="logo-text">
            Learn<span>Toeic</span>
          </div>
        </div>

        <h1 class="login-hero-title">EstudyMe style</h1>
        <p class="login-hero-sub">
          Không gian luyện thi TOEIC hiện đại, trực quan và cá nhân hóa cho từng học viên.
        </p>
      </section>

      <!-- CỘT PHẢI: FORM -->
      <section class="login-panel-wrapper">
        <div class="login-panel">
          <h1 class="login-heading">Đăng nhập</h1>
          <p class="login-subtext">
            Chào mừng bạn trở lại! Vui lòng nhập thông tin của bạn bên dưới.
          </p>

          <form th:action="@{/auth/login}" method="post" class="needs-validation" novalidate>
            <!-- Tài khoản -->
            <div class="mb-3">
              <label for="email" class="form-label">Tài khoản *</label>
              <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="Nhập tài khoản"
                required
              />
            </div>

            <!-- Mật khẩu -->
            <div class="mb-2">
              <label class="form-label d-flex justify-content-between align-items-center" for="password">
                <span>Mật khẩu *</span>
              </label>

              <div class="input-group">
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control"
                  placeholder="••••••••"
                  required
                />
                <button type="button" id="togglePassword" class="btn-eye" aria-label="Hiện/ẩn mật khẩu">
                  <i class="bi bi-eye" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>

            <!-- THÔNG BÁO CHUNG -->
            <div th:if="${message}" class="container mt-3">
              <div
                id="loginMessage"
                th:class="'alert alert-' + (${alertClass} ?: 'info') + ' alert-dismissible fade show'"
                role="alert"
              >
                <span th:text="${message}">Thông báo</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            </div>

            <!-- Quên mật khẩu -->
            <div class="d-flex justify-content-end mb-3">
              <a class="small text-decoration-none" th:href="@{/auth/forgot-password}">Quên mật khẩu?</a>
            </div>

            <!-- Nút đăng nhập -->
            <button type="submit" class="btn-login">ĐĂNG NHẬP</button>
          </form>

          <!-- HOẶC -->
          <div class="login-divider">
            <span>HOẶC</span>
          </div>

          <!-- Google -->
          <a th:href="@{/oauth2/authorization/google}" class="btn-google">
            <img
              src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
              alt="Google"
              class="google-icon"
            />
            Tiếp tục với Google
          </a>

          <!-- Đăng ký -->
          <p class="register-text">
            Bạn chưa có tài khoản?
            <a th:href="@{/auth/signup}" class="link-inline">Đăng ký ngay</a>
          </p>
        </div>
      </section>
    </main>

    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/login.js}"></script>
  </body>
</html>
