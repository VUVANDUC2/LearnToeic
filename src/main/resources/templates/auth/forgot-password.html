<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu • LearnToeic</title>

  <!-- Bootstrap & Icons -->
  <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>

  <style>
    /* ===== PAGE BACKGROUND ===== */
    body.forgot-page {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top right, #ffe6d5 0, transparent 55%),
        radial-gradient(circle at bottom left, #ffeaf2 0, transparent 55%),
        #fff7f2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== CARD ===== */
    .forgot-card {
      width: 100%;
      max-width: 460px;                 /* gọn hơn */
      background-color: #ffffff;
      border-radius: 22px;
      padding: 28px 32px 22px;          /* giảm chiều cao */
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
      text-align: center;
    }

    /* Icon vuông bo góc */
    .forgot-icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 20px;
      border: 2px solid #e5e7eb;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111827;
      font-size: 30px;
    }

    .forgot-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #111827;
    }

    .forgot-sub {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    /* Form label + input */
    .forgot-form .form-label {
      font-weight: 600;
      font-size: 13px;
      color: #374151;
      text-align: left;
      margin-bottom: 6px;
    }

    .forgot-form .form-control {
      display: block;
      width: 100%;                     /* full ngang nút */
      border-radius: 10px;
      padding: 11px 12px;
      border: 1.5px solid #e5e7eb;
      font-size: 0.95rem;
      transition: all .2s ease;
      box-shadow: none;
    }

    .forgot-form .form-control:focus {
      border-color: #ff7a45;
      box-shadow: 0 0 0 3px rgba(255,122,69,.18);
    }

    /* Gửi yêu cầu button */
    .btn-forgot {
      margin-top: 16px;
      width: 100%;
      padding: 11px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 1rem;
      color: #ffffff;
      background-color: #ff7a45;
      box-shadow: 0 8px 18px rgba(248,114,67,0.35);
      transition: all .2s ease;
    }

    .btn-forgot:hover {
      background-color: #ff6a33;
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(248,114,67,0.45);
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
      text-decoration: none;
    }

    .back-link span {
      color: #111827;
      font-weight: 500;
    }

    .back-link:hover span {
      color: #ff7a45;
      text-decoration: underline;
    }

    @media (max-width: 576px) {
      .forgot-card {
        margin: 16px;
        padding: 24px 20px 18px;
      }
    }
  </style>
</head>

<body class="forgot-page">
<main class="forgot-card">

  <!-- Icon -->
  <div class="forgot-icon-wrap">
    <i class="bi bi-lock-fill"></i>
  </div>

  <!-- Title -->
  <h1 class="forgot-title">Quên mật khẩu</h1>
  <p class="forgot-sub">
    Vui lòng nhập địa chỉ email liên kết với tài khoản của bạn,
    chúng tôi sẽ gửi cho bạn một liên kết để đặt lại mật khẩu.
  </p>

  <!-- Form -->
  <form class="forgot-form"
        th:action="@{/auth/forgot-password}"
        method="post"
        novalidate>

    <input type="hidden"
           th:if="${_csrf != null}"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <div th:if="${msg}" class="alert alert-success py-2 mb-3" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger py-2 mb-3" th:text="${error}"></div>

    <div class="mb-1 text-start">
      <label for="email" class="form-label">Địa chỉ email *</label>
      <input id="email"
             name="email"
             type="email"
             class="form-control"
             placeholder="Nhập địa chỉ email của bạn"
             required>
    </div>

    <button type="submit" class="btn-forgot">
      Gửi yêu cầu
    </button>
  </form>

  <!-- Back to login -->
  <a th:href="@{/auth/login}" class="back-link">
    <i class="bi bi-arrow-left"></i>
    <span>Quay lại đăng nhập</span>
  </a>

</main>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
