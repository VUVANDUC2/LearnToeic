<!-- Dispatcher: chọn fragment theo pv.part -->
<th:block th:fragment="partBlock(pv, takeId)"
          th:replace="~{::${'part' + pv.part}(${pv}, ${takeId})}">
</th:block>

<!-- ====== PART 1: PHOTO (IMAGE_CHOICE) ====== -->
<th:block th:fragment="part1(pv, takeId)" th:remove="tag">
  <section >
    <div class="vstack gap-3 questions-scroll">

      <!-- Audio player dùng chung cho toàn Part -->
      <div th:if="${pv.part == 1}" class="mb-3">
      <audio controls preload="none" class="w-100">
          <source src="/assets/tests/p001/test_1_1.mp3" type="audio/mpeg"/>
          Trình duyệt của bạn không hỗ trợ phát audio.
      </audio>
      </div>


      <div th:each="q, it : ${pv.questions}"
          class="card question-card p-3 p-lg-4"
          th:attr="data-type=${q.questionType}"
          th:id="${'q' + (it.index + 1)}">

          <!-- Header: Số câu thật từ DB -->
          <div class="d-flex align-items-center justify-content-between mb-2">
              <span class="badge text-bg-secondary">
              Câu [[${q.questionNumber}]]
              </span>
          </div>
        <!-- Chỉ render ảnh khi là Part 1 hoặc khi có field hasImage -->
        <img th:if="${pv.part == 1}"
            th:src="@{|/assets/tests/p001/test_1_${q.questionNumber}.png|}"
            class="w-100 rounded mb-3" loading="lazy">


        <!-- Các đáp án -->
        <div class="answer-form" th:attr="data-qn=${q.questionNumber}">
          <!-- Bao quanh mỗi câu hỏi -->
<div th:with="sel=${selectedMap?.get(q.questionNumber)},
     cor=${correctMap?.get(q.questionNumber)}">
  <!-- A -->
  <label class="option d-block mb-2"
         th:classappend="${ review ? (cor == 'A' ? ' correct' : (sel == 'A' and cor != 'A') ? ' incorrect' : '')
                                     : (sel == 'A' ? ' active' : '') }">
    <input type="radio"
           th:name="${'q' + q.questionNumber}"
           th:attr="disabled=${review} ? true : null"
           value="A"
           th:checked="${sel == 'A'}"/>
    <strong>A</strong>. <span th:text="${q.optionA}">Option A</span>
  </label>

  <!-- B -->
  <label class="option d-block mb-2"
         th:classappend="${ review ? (cor == 'B' ? ' correct' : (sel == 'B' and cor != 'B') ? ' incorrect' : '')
                                     : (sel == 'B' ? ' active' : '') }">
    <input type="radio"
           th:name="${'q' + q.questionNumber}"
           th:attr="disabled=${review} ? true : null"
           value="B"
           th:checked="${sel == 'B'}"/>
    <strong>B</strong>. <span th:text="${q.optionB}">Option B</span>
  </label>

  <!-- C -->
  <label class="option d-block mb-2"
         th:classappend="${ review ? (cor == 'C' ? ' correct' : (sel == 'C' and cor != 'C') ? ' incorrect' : '')
                                     : (sel == 'C' ? ' active' : '') }">
    <input type="radio"
           th:name="${'q' + q.questionNumber}"
           th:attr="disabled=${review} ? true : null"
           value="C"
           th:checked="${sel == 'C'}"/>
    <strong>C</strong>. <span th:text="${q.optionC}">Option C</span>
  </label>

  <!-- D -->
  <label class="option d-block mb-2"
         th:classappend="${ review ? (cor == 'D' ? ' correct' : (sel == 'D' and cor != 'D') ? ' incorrect' : '')
                                     : (sel == 'D' ? ' active' : '') }">
    <input type="radio"
           th:name="${'q' + q.questionNumber}"
           th:attr="disabled=${review} ? true : null"
           value="D"
           th:checked="${sel == 'D'}"/>
    <strong>D</strong>. <span th:text="${q.optionD}">Option D</span>
  </label>

</div>

          <!-- Nút xóa chọn -->
          <button type="button"
                  class="btn btn-sm btn-outline-secondary btn-clear"
                  th:attr="data-qn=${q.questionNumber}">
            Xóa chọn
          </button>
        </div>
      </div>
    </div>
  </section>
</th:block>
