<div th:fragment="siteHeader">
  <!-- Header / Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" style="box-shadow:0 5px 15px rgba(0,0,0,.04)">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">LEARN TOEIC</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain" aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">

          <li class="nav-item ">
            <a class="nav-link  fw-semibold" href="#" role="button"
              th:href="@{/tests}"
              th:classappend="${requestURI != null && requestURI.startsWith('/tests') ? 'active' : ''}">
              Luyện đề
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold"
              th:href="@{/}"
              th:classappend="${requestURI != null && requestURI == '/phuong-phap' ? 'active' : ''}">
              Phương pháp
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold"
              th:href="@{/flashcards}"
              th:classappend="${requestURI != null && requestURI == '/flashcards' ? 'active' : ''}">
              Flashcards
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold"
              th:href="@{/resources}"
              th:classappend="${requestURI != null && requestURI == '/resources' ? 'active' : ''}">
              Tài liệu
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link fw-semibold"
              th:href="@{/blog}"
              th:classappend="${requestURI != null && requestURI.startsWith('/blog') ? 'active' : ''}">
              Blog
            </a>
          </li>
        </ul>
        <div class="d-flex gap-2">
          <!-- <a class="btn btn-outline-secondary d-none d-lg-inline" href="#search"><i class="bi bi-search"></i></a> -->
          <a class="btn btn-primary px-4" sec:authorize="isAnonymous()" th:href="@{/auth/login}">Đăng nhập</a>
          <!-- Khu vực user + thông báo (đã đăng nhập) -->
          <div class="dropdown" sec:authorize="isAuthenticated()">
            <button class="btn btn-light d-flex align-items-center" data-bs-toggle="dropdown">
              <img th:src="${#authentication.authenticated ? '/uploads/avatars/' + #authentication.name + '.jpg' : '/assets/img/avatar-default.png'}"
                  class="rounded-circle me-2" style="width:32px;height:32px" alt="avatar">
              <span th:text="${#authentication.authenticated ? #authentication.name : 'Tài khoản'}">Tài khoản</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
              <li><a class="dropdown-item" th:href="@{/profile}">Trang cá nhân</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li>
                <form th:action="@{/logout}" method="post" class="px-3">
                  <button type="submit" class="btn btn-outline-danger w-100">Đăng xuất</button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>
</div>
