<div th:fragment="siteHeader">
  <!-- Header / Navbar -->
  <nav
    class="navbar navbar-expand-lg navbar-light bg-white fixed-top"
    style="box-shadow: 0 5px 10px rgba(0, 0, 0, 0.04)"
  >
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">LEARN TOEIC</a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMain"
        aria-controls="navMain"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              role="button"
              th:href="@{/tests}"
              th:classappend="${
                requestURI != null && requestURI.startsWith('/tests')
                  ? 'active'
                  : ''
              }"
            >
              Luyện đề
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/}"
              th:classappend="${
                requestURI != null && requestURI == '/phuong-phap'
                  ? 'active'
                  : ''
              }"
            >
              Phương pháp
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/flashcards}"
              th:classappend="${
                requestURI != null && requestURI == '/flashcards'
                  ? 'active'
                  : ''
              }"
            >
              Flashcards
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/resources}"
              th:classappend="${
                requestURI != null && requestURI == '/resources'
                  ? 'active'
                  : ''
              }"
            >
              Tài liệu
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/blog}"
              th:classappend="${
                requestURI != null && requestURI.startsWith('/blog')
                  ? 'active'
                  : ''
              }"
            >
              Blog
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <!-- Chưa login -->
          <div class="d-flex gap-2" sec:authorize="isAnonymous()">
            <a class="btn btn-outline-primary px-4" th:href="@{/auth/signup}">
              <i class="bi bi-person-plus"></i>
              <span class="ms-1">Đăng ký</span>
            </a>

            <a
              class="btn btn-primary px-4"
              id="navLoginBtn"
              th:href="@{/auth/login}"
            >
              <i class="bi bi-box-arrow-in-right"></i>
              <span class="ms-1">Đăng nhập</span>
            </a>
          </div>

          <!-- Đã login -->
          <div
            class="account-dropdown-wrapper position-relative"
            sec:authorize="isAuthenticated()"
          >
            <button
              class="btn p-0 border-0 bg-transparent"
              type="button"
              id="userMenuBtn"
            >
              <span
                th:if="${avatarData != null}"
                class="avatar-img-circle-wrapper"
              >
                <img
                  th:src="${avatarData}"
                  alt="User avatar"
                  class="avatar-img-circle"
                />
              </span>

              <span th:if="${avatarData == null}" class="avatar-text-circle">
                <span th:text="${initial}" class="user-initials">Initial</span>
              </span>
            </button>

            <!-- Custom Dropdown -->
            <ul class="account-menu-dropdown" id="userMenu">
              <li>
                <a class="dropdown-item" th:href="@{/profile}">Trang cá nhân</a>
              </li>
              <li>
                <a class="dropdown-item text-danger" th:href="@{/account/delete}"
                  >Xoá tài khoản</a
                >
              </li>
              <li>
                <form th:action="@{/logout}" method="post">
                  <button type="submit" class="dropdown-item">Đăng xuất</button>
                </form>
              </li>
            </ul>
          </div>
        </div>
        <!-- /right -->
      </div>
      <!-- /collapse -->
    </div>
  </nav>

  <!-- Flash bubble script -->
  <script th:inline="javascript">
    (function () {
      /*<![CDATA[*/
      const flashMessage = /*[[${message} ?: null]]*/ null;
      const flashType = /*[[${alertClass} ?: 'info']]*/ "info";
      /*]]>*/

      if (!flashMessage) return;

      const target =
        document.getElementById("userMenuBtn") ||
        document.getElementById("navLoginBtn");
      if (!target) return;

      const bubble = document.createElement("div");
      bubble.className = `flash-bubble ${flashType}`;
      bubble.textContent = flashMessage;

      bubble.style.visibility = "hidden";
      document.body.appendChild(bubble);

      const rect = target.getBoundingClientRect();
      const bw = bubble.offsetWidth;
      const bh = bubble.offsetHeight;

      const x = Math.min(
        window.innerWidth - bw - 12,
        Math.max(12, rect.right + window.scrollX + 12)
      );

      const y = Math.max(
        12,
        rect.top + window.scrollY + rect.height / 2 - bh / 2
      );

      bubble.style.left = `${x}px`;
      bubble.style.top = `${y}px`;
      bubble.style.visibility = "visible";

      setTimeout(() => bubble.classList.add("hide"), 3200);
      setTimeout(() => bubble.remove(), 3800);
    })();
  </script>
</div>
