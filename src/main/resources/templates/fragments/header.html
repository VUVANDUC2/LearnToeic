<div th:fragment="siteHeader">
  <!-- Header / Navbar -->
  <nav
    class="navbar navbar-expand-lg navbar-light bg-white"
    style="box-shadow: 0 5px 10px rgba(0, 0, 0, 0.04)"
  >
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">LEARN TOEIC</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMain"
        aria-controls="navMain"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMain">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              href="#"
              role="button"
              th:href="@{/tests}"
              th:classappend="${requestURI != null && requestURI.startsWith('/tests') ? 'active' : ''}"
            >
              Luyện đề
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/}"
              th:classappend="${requestURI != null && requestURI == '/phuong-phap' ? 'active' : ''}"
            >
              Phương pháp
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/flashcards}"
              th:classappend="${requestURI != null && requestURI == '/flashcards' ? 'active' : ''}"
            >
              Flashcards
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/resources}"
              th:classappend="${requestURI != null && requestURI == '/resources' ? 'active' : ''}"
            >
              Tài liệu
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link fw-semibold"
              th:href="@{/blog}"
              th:classappend="${requestURI != null && requestURI.startsWith('/blog') ? 'active' : ''}"
            >
              Blog
            </a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <!-- CHƯA login -->
          <a
            class="btn btn-primary px-4"
            sec:authorize="isAnonymous()"
            th:href="@{/auth/login}"
          >
            Đăng nhập
          </a>

          <!-- CHƯA login -->
          <a
            class="btn btn-primary px-4"
            id="navLoginBtn"
            sec:authorize="isAnonymous()"
            th:href="@{/auth/login}"
          >
            Đăng nhập
          </a>

          <!-- ĐÃ login -->
          <div
            class="account-dropdown-wrapper position-relative"
            sec:authorize="isAuthenticated()"
          >
            <button
              class="btn p-0 border-0 bg-transparent"
              type="button"
              id="userMenuBtn"
            >
              <span class="avatar-text-circle">
                <span
                  th:text="${currentUser != null 
                        ? #strings.substring(
                              currentUser.fullName.split(' ')[currentUser.fullName.split(' ').length - 1],
                              0, 1
                          ).toUpperCase()
                        : 'D'}"
                >
                </span>
              </span>
            </button>

            <!-- menu tự làm, KHÔNG dùng class dropdown-menu nữa -->
            <ul class="account-menu-dropdown" id="userMenu">
              <li>
                <a class="dropdown-item" th:href="@{/profile}">Trang cá nhân</a>
              </li>
              <li>
                <a
                  class="dropdown-item text-danger"
                  th:href="@{/account/delete}"
                  >Xoá tài khoản</a
                >
              </li>
              <li>
                <form th:action="@{/logout}" method="post">
                  <button type="submit" class="dropdown-item">Đăng xuất</button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <style>
    .flash-bubble {
      position: fixed;
      padding: 8px 12px;
      border-radius: 10px;
      color: #fff;
      background: #0ea5e9;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      white-space: nowrap;
      max-width: 260px;
      text-overflow: ellipsis;
      overflow: hidden;
      z-index: 9000;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .flash-bubble.success {
      background: #22c55e;
    }
    .flash-bubble.danger {
      background: #ef4444;
    }
    .flash-bubble.info {
      background: #0ea5e9;
    }
    .flash-bubble.hide {
      opacity: 0;
      transform: translateY(-8px);
    }
  </style>

  <script th:inline="javascript">
    (function () {
      /*<![CDATA[*/
      const flashMessage = /*[[${message} ?: null]]*/ null;
      const flashType = /*[[${alertClass} ?: 'info']]*/ "info";
      /*]]>*/
      if (!flashMessage) return;

      const target =
        document.getElementById("userMenuBtn") ||
        document.getElementById("navLoginBtn");
      if (!target) return;

      const bubble = document.createElement("div");
      bubble.className = `flash-bubble ${flashType}`;
      bubble.textContent = flashMessage;
      bubble.style.visibility = "hidden";
      document.body.appendChild(bubble);

      const rect = target.getBoundingClientRect();
      const bw = bubble.offsetWidth;
      const bh = bubble.offsetHeight;
      const x = Math.min(
        window.innerWidth - bw - 12,
        Math.max(12, rect.right + window.scrollX + 12)
      );
      const y = Math.max(
        12,
        rect.top + window.scrollY + rect.height / 2 - bh / 2
      );

      bubble.style.left = `${x}px`;
      bubble.style.top = `${y}px`;
      bubble.style.visibility = "visible";

      setTimeout(() => bubble.classList.add("hide"), 3200);
      setTimeout(() => bubble.remove(), 3800);
    })();
  </script>
</div>
