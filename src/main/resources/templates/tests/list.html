        transition: all 0.25s ease;
      }

      .card-test:hover {

      /* =================================================== */

        border: 1px solid #dee2e6;
        border-radius: 6px;
        margin: 0 3px;
      }

      .pagination .page-item.active .page-link {
        background-color: #2563eb;
        border-color: #2563eb;
        color: #fff;
      }

      .pagination .page-item.disabled .page-link {
        color: #ccc;
        pointer-events: none;
        background-color: #f8f9fa;
      }
    </style>
  </head>
  <body>
    <!-- Header fragment -->
    <div th:replace="fragments/header :: siteHeader"></div>
    <!-- Main -->
    <main class="container my-4">
      <!-- Tiêu đề trang -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h3 class="mb-0">Thư viện đề thi</h3>
        <!-- <a th:href="@{/'/}" class="btn btn-outline-secondary btn-sm">Trang chủ</a> -->
      </div>
      <!-- Thanh công cụ -->
      <div
        class="d-flex flex-wrap align-items-center justify-content-between mb-3"
      >
        <div class="text-muted">
          <strong th:text="${#lists.size(tests)}">0</strong> đề thi khả dụng
        </div>

        <!-- (Tuỳ chọn) Thanh tìm kiếm / sắp xếp -->
        <form
          class="d-flex"
          role="search"
          th:action="@{/tests/search}"
          method="get"
        >
          <input
            class="form-control me-2"
            type="search"
            name="keyword"
            placeholder="Tìm theo tên đề..."
            aria-label="Search"
          />
          <button class="btn btn-outline-primary" type="submit">Tìm</button>
        </form>
      </div>

      <!-- Khi rỗng -->
      <div
        class="empty text-center"
        th:if="${tests == null or #lists.isEmpty(tests)}"
      >
        <h5 class="mb-1">Chưa có đề thi nào</h5>
        <p class="mb-0 text-muted">
          Vui lòng quay lại sau hoặc liên hệ quản trị viên để thêm đề thi.
        </p>
      </div>

      <!-- Lưới thẻ -->
      <div class="row g-4" th:if="${tests != null and !#lists.isEmpty(tests)}">
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3" th:each="t : ${tests}">
          <div class="card card-test h-100">
            <!-- Ảnh ngẫu nhiên theo testId (ổn định) -->
            <img
              th:src="@{|https://picsum.photos/seed/${t.testId}/600/380|}"
              alt="thumbnail"
            />

            <div class="card-body d-flex flex-column">
              <h5 class="card-title mb-1" th:text="${t.testName}">Tên đề</h5>

              <div class="meta mb-2">
                <span class="me-2"
                  >🗓
                  <span
                    th:text="${t.testDate != null ? #dates.format(t.testDate, 'dd/MM/yyyy') : '—'}"
                    >—</span
                  >
                </span>
                <span>📝 <span th:text="${t.totalQuestions}">0</span> câu</span>
              </div>

              <div class="d-flex align-items-center gap-2 mb-3">
                <span class="badge badge-soft"
                  >Mã đề #<span th:text="${t.testId}">0</span></span
                >
                <span class="badge text-bg-light">TOEIC</span>
              </div>

              <div class="mt-auto">
                <!-- Dùng POST để start -->
                <form
                  th:action="@{|/tests/${t.testId}/start|}"
                  method="get"
                  class="d-grid"
                >
                  <button type="submit" class="btn btn-primary">
                    Bắt đầu làm bài
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
        <!-- col -->
      </div>
      <!-- row -->
      <!-- Pagination -->
      <div class="d-flex justify-content-center mt-4" th:if="${totalPages > 1}">
        <nav>
          <ul class="pagination">
            <!-- Prev -->
            <li
              class="page-item"
              th:classappend="${currentPage == 0} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="${#strings.isEmpty(keyword)} ?
                    @{/tests(page=${currentPage - 1})} :
                    @{/tests/search(page=${currentPage - 1}, keyword=${keyword})}"
              >
                &laquo;
              </a>
            </li>

            <!-- Pages -->
            <li
              class="page-item"
              th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
              th:classappend="${i == currentPage} ? 'active'"
            >
              <a
                class="page-link"
                th:text="${i + 1}"
                th:href="${#strings.isEmpty(keyword)} ?
                    @{/tests(page=${i})} :
                    @{/tests/search(page=${i}, keyword=${keyword})}"
              >
              </a>
            </li>

            <!-- Next -->
            <li
              class="page-item"
              th:classappend="${currentPage == totalPages - 1} ? 'disabled'"
            >
              <a
                class="page-link"
                th:href="${#strings.isEmpty(keyword)} ?
                    @{/tests(page=${currentPage + 1})} :
                    @{/tests/search(page=${currentPage + 1}, keyword=${keyword})}"
              >
                &raquo;
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
    <!-- Footer fragment -->
    <div th:replace="fragments/footer :: siteFooter"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Home.js" defer></script>
  </body>
</html>
