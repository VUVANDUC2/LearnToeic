<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Danh sách đề thi</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/home.css}">

  <style>
    body { background: #f7f8fb; padding-top: 4.5rem;}
    .page-header { background: #ffffff; border-bottom: 2px solid #eee; }
    .card-test { border: none; border-radius: 1rem; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.06); height: 100%; }
    .card-test img { width: 100%; height: 180px; object-fit: cover; }
    .badge-soft { background: #eef2ff; color: #1f3bb3; }
    .meta { color: #6c757d; font-size: .9rem; }
    .empty { border: 2px dashed #d0d7de; border-radius: 1rem; padding: 2rem; background: #fff; }
  </style>
</head>
<body>
  <!-- Header fragment -->
  <div th:replace="fragments/header :: siteHeader"></div>
  <!-- Main -->
  <main class="container my-4">
    <!-- Tiêu đề trang -->
    <div class="d-flex align-items-center justify-content-between mb-3">
      <h3 class="mb-0">Thư viện đề thi</h3>
      <!-- <a th:href="@{/'/}" class="btn btn-outline-secondary btn-sm">Trang chủ</a> -->
    </div>
    <!-- Thanh công cụ -->
    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
      <div class="text-muted">
        <strong th:text="${#lists.size(tests)}">0</strong> đề thi khả dụng
      </div>

      <!-- (Tuỳ chọn) Thanh tìm kiếm / sắp xếp -->
      <form class="d-flex" role="search" th:action="@{/tests/search}" method="get">
        <input class="form-control me-2"
              type="search"
              name="keyword"
              placeholder="Tìm theo tên đề..."
              aria-label="Search">
        <button class="btn btn-outline-primary" type="submit">Tìm</button>
      </form>
    </div>

    <!-- Khi rỗng -->
    <div class="empty text-center" th:if="${tests == null or #lists.isEmpty(tests)}">
      <h5 class="mb-1">Chưa có đề thi nào</h5>
      <p class="mb-0 text-muted">Vui lòng quay lại sau hoặc liên hệ quản trị viên để thêm đề thi.</p>
    </div>

    <!-- Lưới thẻ -->
    <div class="row g-4" th:if="${tests != null and !#lists.isEmpty(tests)}">
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3" th:each="t : ${tests}">
        <div class="card card-test h-100">
          <!-- Ảnh ngẫu nhiên theo testId (ổn định) -->
          <img th:src="@{|https://picsum.photos/seed/${t.testId}/600/380|}" alt="thumbnail"/>

          <div class="card-body d-flex flex-column">
            <h5 class="card-title mb-1" th:text="${t.testName}">Tên đề</h5>

            <div class="meta mb-2">
              <span class="me-2">🗓
                <span th:text="${t.testDate != null ? #dates.format(t.testDate, 'dd/MM/yyyy') : '—'}">—</span>
              </span>
              <span>📝 <span th:text="${t.totalQuestions}">0</span> câu</span>
            </div>

            <div class="d-flex align-items-center gap-2 mb-3">
              <span class="badge badge-soft">Mã đề #<span th:text="${t.testId}">0</span></span>
              <span class="badge text-bg-light">TOEIC</span>
            </div>

            <div class="mt-auto">
              <!-- Dùng POST để start -->
              <form th:action="@{|/tests/${t.testId}/start|}" method="get" class="d-grid">
                <button type="submit" class="btn btn-primary">
                  Bắt đầu làm bài
                </button>
              </form>
            </div>
          </div>
        </div>
      </div><!-- col -->
    </div><!-- row -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
