<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${view != null and view.testName != null ? view.testName : 'Bài thi'}">Bài thi</title>

  <!-- CSRF -->
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    :root {
      --sidebar-w: 320px;
      --header-h: 72px;
    }

    body { background:#f7f8fb; }

    .exam-header {
      position:sticky; top:0; z-index:1030;
      background:#fff; border-bottom:1px solid #eee;
      height:var(--header-h);
    }

    .exam-wrapper {
      display:grid;
      grid-template-columns:1fr var(--sidebar-w);
      gap:1.25rem;
    }

    @media (max-width: 992px){ .exam-wrapper{grid-template-columns:1fr;} }

    .questions-scroll{max-height:calc(100vh - 160px);overflow:auto;padding-right:6px}
    aside .sticky{position:sticky;top:88px}

    /* Câu hỏi */
    .question-card {
      border:none;
      box-shadow:0 6px 20px rgba(0,0,0,.06);
      border-radius:1rem;
    }

    .option {
      border:1px solid #e9ecef;
      border-radius:.75rem;
      padding:.75rem 1rem;
      cursor:pointer;
      transition:background .2s,border-color .2s;
    }

    .option:hover { background:#f5f9ff; border-color:#bcd2ff; }
    .option input { display:none; }
    .option.active { background:#e8f0ff; border-color:#0d6efd; }
    .option.correct { border-color:#28a745; background:#e9f7ef; }
    .option.incorrect { border-color:#dc3545; background:#fdecea; }
    /* Sidebar nút câu hỏi */
    .qgrid {
      list-style:none;
      margin:0; padding:0;
      display:grid;
      grid-template-columns:repeat(6,1fr);
      gap:.5rem;
    }

    .qbtn {
      display:flex;
      justify-content:center;
      align-items:center;
      width:36px; height:36px;
      border:1px solid #dee2e6;
      border-radius:6px;
      background:#fff;
      color:#333;
      font-weight:500;
      transition:all .2s;
      text-decoration:none;
    }

    .qbtn:hover {
      background:#f0f8ff;
      border-color:#0d6efd;
      color:#0d6efd;
    }

    /* Hiện tại (current) */
    .qbtn.current {
      background-color:#ffffff;
      color:#0d6efd;
      border:2px solid #0d6efd;
      font-weight:600;
    }

    /* Đã chọn (answered) */
    .qbtn.answered {
      background-color:#0d6efd;
      color:#fff;
      border:1px solid #0d6efd;
      font-weight:600;
    }

    /* Khi cả current và answered */
    .qbtn.current.answered {
      background-color:#0b5ed7;
      color:#fff;
      border:2px solid #0b5ed7;
    }
    .qbtn.answered.correct { background:#d1e7dd; color:#0f5132; border-color:#badbcc; }
    .qbtn.answered.wrong   { background:#f8d7da; color:#842029; border-color:#f5c2c7; }


    @media (max-width:576px){
      .qgrid{grid-template-columns:repeat(5,1fr);gap:.4rem;}
      .qbtn{min-width:34px;}
    }
  </style>
</head>

<body>

<header class="exam-header d-flex align-items-center">
  <div class="container d-flex align-items-center justify-content-between gap-3">
    <div class="d-flex align-items-center gap-3">
      <a th:href="@{/tests}" class="btn btn-outline-secondary btn-sm">Danh sách đề</a>
      <div>
        <h6 class="mb-0" th:text="${view.testName}">TOEIC Practice Test</h6>
        <small class="text-muted">
          Mã đề: <span th:text="${view.testId}">0</span>
          • Tổng câu: <span th:text="${view.totalQuestions}">0</span>
        </small>
      </div>
    </div>

    <div class="d-flex align-items-center gap-3">
      <div class="text-center" th:if="${!review}">
        <div class="small text-muted">Thời gian còn lại</div>
        <div id="countdown" class="fs-5 fw-bold">--:--:--</div>
      </div>

      <form th:if="${not (review ?: false)}" th:action="@{|/take/${view.takeId}/submit|}" method="post" class="m-0">
        <input type="hidden" name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button id="btnSubmitTop" type="submit" class="btn btn-primary">Nộp bài</button>
      </form>

      <a th:if="${not (review ?: false)}" th:href="@{/tests}" class="btn btn-outline-primary">Quay về</a>
    </div>
  </div>
</header>

<!-- Tabs Part 1..7 -->
<div class="bg-white border-bottom">
  <div class="container py-2">
    <ul class="nav nav-pills gap-2" id="nav-parts">
      <li class="nav-item" th:each="p : ${#numbers.sequence(1,7)}">
        <a class="nav-link"
           th:classappend="${p} == ${pv.part} ? 'active' : ''"
           href="javascript:void(0)"
           th:attr="
             data-part=${p},
             data-hx-get=@{|/tests/take/${view.takeId}/part/${p}|},
             data-hx-target='#part-container',
             data-hx-swap='innerHTML',
             data-hx-push-url=@{|/tests/take/${view.takeId}?part=${p}|},
             data-review=@{|/tests/${view.takeId}/review?part=${p}|}
           ">
          Part [[${p}]]
        </a>
      </li>
    </ul>
  </div>
</div>

<main class="container my-3">
  <div class="exam-wrapper">

    <!-- Main content -->
    <div id="part-container"
         th:insert="~{fragments/take-parts :: partBlock(${pv}, ${view.takeId})}">
    </div>

    <!-- Sidebar -->
    <aside>
      <div class="card p-3 mb-3 sticky" style="border:none; box-shadow:0 6px 20px rgba(0,0,0,.06); border-radius:1rem;">

        <div class="mb-3">
          <div class="text-muted small">Thời gian làm bài:</div>
          <div id="countdown" class="fs-2 fw-bold">00:00</div>
        </div>

        <form id="autoSubmitForm" th:action="@{|/tests/${view.takeId}/submit|}" method="post" class="mb-3">
          <button class="btn btn-primary btn-lg w-100" type="submit">NỘP BÀI</button>
        </form>

        <div th:each="p : ${#numbers.sequence(1,7)}" class="mb-3">
          <div class="fw-semibold mb-2">Part [[${p}]]</div>

          <ul class="qgrid">
            <li th:each="qnum, it : ${view.partMap.get(p) ?: view.partMap.get(T(java.lang.Integer).valueOf(p)) ?: {}}">

              <a class="qbtn"
                 th:text="${qnum}"
                 th:attr="data-qn=${qnum}"
                 th:classappend="${(p == pv.part ? ' current' : '') +
                                 ((view.selectedMap != null and view.selectedMap.containsKey(qnum)) ? ' answered' : '')}"
                 th:href="${p} == ${pv.part}
                            ? ${'#q' + (it.index + 1)}
                            : (${review}
                                ? @{|/tests/${view.takeId}/review?part=${p}|}
                                : @{|/take/${view.takeId}?part=${p}|})">
              </a>

            </li>
          </ul>
        </div>
      </div>
    </aside>
  </div>
</main>

<!-- JS -->
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const IS_REVIEW = /*[[${review}]]*/ false;
  window._answers = {};

  // --- Khôi phục highlight & đồng bộ sidebar sau khi HTMX swap (chạy ở cả 2 chế độ) ---
  document.body.addEventListener('htmx:afterSwap', e => {
    // Nếu muốn chỉ áp dụng khi thay #part-container, mở comment dưới:
    // if (e.detail.target.id !== 'part-container') return;

    // Phục hồi highlight trong card dựa trên radio đang checked
    document.querySelectorAll('.answer-form input[type=radio]:checked')
      .forEach(input => input.closest('.option')?.classList.add('active'));

    // Đồng bộ sidebar (ô số câu) theo radio đang checked
    document.querySelectorAll('.answer-form').forEach(f => {
      const qn = f.dataset.qn;
      const checked = f.querySelector('input[type=radio]:checked');
      document.querySelectorAll(`.qbtn[data-qn="${qn}"]`).forEach(btn => {
        btn.classList.toggle('answered', !!checked);
      });
    });

    // Ở chế độ làm bài, bật lại wireCollectOnly và phục hồi theo state (_answers)
    if (!IS_REVIEW) {
      wireCollectOnly();
      // Phục hồi chọn theo state khi chuyển part
      document.querySelectorAll('.answer-form').forEach(f => {
        const qn = parseInt(f.dataset.qn, 10);
        const sel = window._answers[qn];
        if (sel) {
          const input = f.querySelector(`input[type=radio][value="${sel}"]`);
          if (input) {
            input.checked = true;
            input.closest('.option')?.classList.add('active');
            document.querySelectorAll(`.qbtn[data-qn="${qn}"]`).forEach(btn => btn.classList.add('answered'));
          }
        }
      });
    }
  });

  // --- Đổi tab Part (UI only) ---
  document.body.addEventListener('htmx:beforeRequest', function(e){
    const a = e.detail.elt;
    if (!a || !a.matches('#nav-parts .nav-link')) return;
    document.querySelectorAll('#nav-parts .nav-link').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  });

  // --- Lỗi HTMX ---
  document.body.addEventListener('htmx:error', function (e) {
    if (e.detail?.requestConfig?.target?.id === 'part-container') {
      e.detail.requestConfig.target.innerHTML =
        '<div class="alert alert-danger mb-0">Không tải được phần này (500). Vui lòng thử lại.</div>';
    }
  });

  // --- Chỉ dùng ở chế độ LÀM BÀI: gom câu trả lời vào _answers & tô "answered" ---
  function wireCollectOnly() {
    // Nếu đang review thì thoát (không gắn listener)
    if (IS_REVIEW) return;

    document.querySelectorAll('.answer-form').forEach(block => {
      const qn = parseInt(block.dataset.qn, 10);
      block.querySelectorAll('input[type=radio]').forEach(input => {
        // Tránh gắn trùng nhiều lần khi swap nhiều lần:
        if (input.__wired) return;
        input.__wired = true;

        input.addEventListener('change', e => {
          // Highlight trong card
          block.querySelectorAll('.option').forEach(l => l.classList.remove('active'));
          e.target.closest('.option')?.classList.add('active');

          // Đánh dấu sidebar
          document.querySelectorAll(`.qbtn[data-qn="${qn}"]`).forEach(btn => btn.classList.add('answered'));

          // Cập nhật state cục bộ (không gửi server ngay)
          window._answers[qn] = e.target.value;
        });
      });
    });
  }

  // --- DOM Ready ---
  document.addEventListener('DOMContentLoaded', () => {
    // Chỉ gắn listener thu câu trả lời khi KHÔNG phải review
    if (!IS_REVIEW) {
      wireCollectOnly();
    }
  });

  // --- Trước khi submit form: nhét JSON vào hidden input (CHỈ ở chế độ làm bài) ---
  if (!IS_REVIEW) {
    document.addEventListener('submit', e => {
      const form = e.target;
      if (!form.matches('#autoSubmitForm, #submitTopForm')) return;

      // Tạo/ cập nhật input ẩn
      let hidden = form.querySelector('input[name="answersJson"]');
      if (!hidden) {
        hidden = document.createElement('input');
        hidden.type = 'hidden';
        hidden.name = 'answersJson';
        form.appendChild(hidden);
      }
      hidden.value = JSON.stringify(window._answers); // {"101":"B","102":"D",...}
    });
  }
</script>
</body>
</html>
