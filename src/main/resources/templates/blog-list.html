<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/blog.css}">
    <link rel="stylesheet" th:href="@{/css/Home.css}">
</head>
<body class="page">
<!-- Header fragment -->
<div th:replace="fragments/header :: siteHeader"></div>
<header class="header">
    <div class="header-inner">
        <h1>Blog</h1>
        <p class="meta">Chia sẻ kiến thức TOEIC</p>
    </div>
</header>

<main class="blog-container">
    <section class="card list">
        <div th:if="${#lists.isEmpty(posts)}" class="empty">
            Chưa có bài viết nào.
        </div>
        <div th:each="post : ${posts}" class="post-item">
            <div class="post-thumb" th:if="${post.thumbnail}">
                <img th:src="${post.thumbnail}" alt="thumb">
            </div>
            <div class="post-body">
                <a th:href="@{'/blog/' + ${post.slug}}" class="post-title" th:text="${post.title}">Tiêu đề</a>
                <p class="post-meta">
                    <span th:text="${post.category}">Chuyên mục</span> •
                    <span th:text="${post.program}">Chương trình</span> •
                    <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">Ngày</span>
                </p>
                <p class="post-excerpt" th:text="${post.excerpt}">Mô tả ngắn</p>
            </div>
        </div>
    </section>
</main>
<!-- Footer fragment -->
<div th:replace="fragments/footer :: siteFooter"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/Home.js" defer></script>
</body>
</html>
