<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title}">Bài viết</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/blog.css}">
</head>
<body class="page">
<!-- Header fragment -->
<div th:replace="fragments/header :: siteHeader"></div>
<header class="header">
    <div class="header-inner">
        <h1 th:text="${post.title}">Tiêu đề</h1>
        <p class="meta">
            <span th:text="${post.category}">Chuyên mục</span> |
            <span th:text="${post.program}">Chương trình</span> |
            <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">Ngày</span>
        </p>
    </div>
</header>

<main class="blog-container">
    <div class="layout">
        <aside class="card toc">
            <h3>Nội dung chính</h3>
            <ol class="toc-level toc-lv-1">
                <li><a href="#" data-target="overview">1. Đánh giá chung</a></li>
                <li>
                    <a href="#" data-target="listening">2. Listening</a>
                    <ol class="toc-level toc-lv-2">
                        <li><a href="#" data-target="part1">2.1 Part 1</a></li>
                        <li><a href="#" data-target="part2">2.2 Part 2</a></li>
                        <li><a href="#" data-target="part3">2.3 Part 3</a></li>
                        <li><a href="#" data-target="part4">2.4 Part 4</a></li>
                    </ol>
                </li>
                <li>
                    <a href="#" data-target="reading">3. Reading</a>
                    <ol class="toc-level toc-lv-2">
                        <li><a href="#" data-target="part5">3.1 Part 5</a></li>
                        <li><a href="#" data-target="part6">3.2 Part 6</a></li>
                        <li><a href="#" data-target="part7">3.3 Part 7</a></li>
                    </ol>
                </li>
            </ol>
        </aside>
        <article class="card content">
            <div class="content-body" th:utext="${post.content}"></div>
        </article>
    </div>

    <section class="card related" th:if="${relatedPosts}">
        <h3>Đề xuất đọc thêm</h3>
        <div class="related-list">
            <div class="related-item" th:each="item : ${relatedPosts}">
                <div class="related-thumb" th:if="${item.thumbnail}">
                    <img th:src="${item.thumbnail}" alt="" />
                </div>
                <div class="related-body">
                    <a th:href="@{'/blog/' + ${item.slug}}" th:text="${item.title}" class="related-title">Tiêu đề</a>
                    <p class="related-meta">
                        <span th:text="${item.category}">Category</span> •
                        <span th:text="${item.program}">Program</span>
                    </p>
                    <p class="related-excerpt" th:text="${item.excerpt}">Excerpt</p>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const mapping = [
            { target: 'overview', labels: ['đánh giá chung'] },
            { target: 'listening', labels: ['listening'] },
            { target: 'part1', labels: ['2.1 part 1', 'part 1'] },
            { target: 'part2', labels: ['2.2 part 2', 'part 2'] },
            { target: 'part3', labels: ['2.3 part 3', 'part 3'] },
            { target: 'part4', labels: ['2.4 part 4', 'part 4'] },
            { target: 'reading', labels: ['reading'] },
            { target: 'part5', labels: ['3.1 part 5', 'part 5'] },
            { target: 'part6', labels: ['3.2 part 6', 'part 6'] },
            { target: 'part7', labels: ['3.3 part 7', 'part 7'] }
        ];

        const contentNodes = Array.from(document.querySelectorAll('.content-body *'))
            .filter(node => node.textContent && node.textContent.trim().length);

        mapping.forEach(item => {
            const anchor = document.querySelector(`a[data-target="${item.target}"]`);
            if (!anchor) {
                return;
            }

            const targetNode = contentNodes.find(node => {
                const text = node.textContent.trim().toLowerCase();
                return item.labels.some(label => text.startsWith(label));
            });

            if (targetNode) {
                const id = `section-${item.target}`;
                targetNode.setAttribute('id', id);
                anchor.setAttribute('href', `#${id}`);
            } else {
                anchor.removeAttribute('href');
                anchor.classList.add('toc-disabled');
            }
        });
    });
</script>
<!-- Footer fragment -->
<div th:replace="fragments/footer :: siteFooter"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/Home.js" defer></script>
</body>
</html>
