<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thông tin cá nhân • LearnToeic</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/Home.css}">
  <style>
    :root{
      --brand:#ff7a45;
      --ink:#111827;
    }

    body{
      margin:0;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at top left,#ffe7f3 0,transparent 55%),
        radial-gradient(circle at bottom right,#e0f2ff 0,transparent 55%),
        #f6f8ff;
      min-height:100vh;
      color:var(--ink);
    }

    .profile-wrapper{
      padding:60px 12px 40px;
    }

    .profile-title{
      font-weight:800;
      text-align:center;
      margin-bottom:32px;
      font-size:2rem;
    }

    .profile-card{
      max-width:1100px;
      margin:0 auto;
      background:#fff;
      border-radius:24px;
      box-shadow:0 16px 40px rgba(15,23,42,.12);
      padding:32px 26px;
    }

    @media (min-width:992px){
      .profile-card{padding:40px 38px;}
    }

    .profile-avatar{
      width:220px;
      height:220px;
      border-radius:50%;
      background:#9ca3af;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0 auto;
      color:#fff;
    }

    .profile-avatar i{
      font-size:64px;
    }

    .profile-name{
      font-weight:600;
      margin-top:14px;
      font-size:1.05rem;
    }

    .profile-label{
      font-weight:600;
      margin-bottom:4px;
    }

    .profile-card .form-control{
      border-radius:999px;
      padding-top:.55rem;
      padding-bottom:.55rem;
      border-color:#e5e7eb;
    }

    .profile-card .input-group-text{
      border-radius:999px 0 0 999px;
      border-color:#e5e7eb;
      background:#f9fafb;
      color:#6b7280;
    }

    .btn-pill{
      border-radius:999px;
      padding:.55rem 1.4rem;
    }

    .btn-primary{
      background:var(--brand);
      border-color:var(--brand);
    }

    .btn-primary:hover{
      background:#f97316;
      border-color:#f97316;
    }
  </style>
</head>
<body>
<div th:replace="fragments/header :: siteHeader"></div>
<div class="profile-wrapper">
  <h1 class="profile-title">Thông tin cá nhân</h1>

  <div class="profile-card">
    <div class="row g-4 align-items-center">

      <!-- Cột trái: avatar -->
      <div class="col-lg-4 text-center">
        <div class="profile-avatar">
          <!-- nếu sau này có ảnh: thay i bằng <img src="..." class="w-100 h-100 rounded-circle"> -->
          <i class="bi bi-person-fill"></i>
        </div>
        <div class="profile-name">sdfghj</div>
      </div>

      <!-- Cột phải: thông tin -->
      <div class="col-lg-8">
        <!-- Dòng tài khoản -->
        <p class="mb-3">
          <span class="profile-label">Tài khoản:</span>
          <span>du1244567@gmail.com</span>
          <button type="button" class="btn btn-link btn-sm text-decoration-none ps-2 copy-email">
            <i class="bi bi-clipboard"></i>
          </button>
        </p>

        <!-- Form thông tin -->
        <form>
          <div class="row g-3">
            <!-- Họ tên -->
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" placeholder="Họ tên" value="sdfghj">
              </div>
            </div>

            <!-- Email -->
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" value="du1244567@gmail.com" readonly>
              </div>
            </div>

            <!-- Ngày sinh -->
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                <input type="date" class="form-control" placeholder="dd/mm/yyyy">
              </div>
            </div>

            <!-- SĐT -->
            <div class="col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                <input type="text" class="form-control" placeholder="Số điện thoại">
              </div>
            </div>

            <!-- Nút -->
            <div class="col-md-6 mt-3">
              <button type="button" class="btn btn-outline-secondary btn-pill w-100">
                Đổi mật khẩu
              </button>
            </div>
            <div class="col-md-6 mt-3 text-md-end">
              <button type="submit" class="btn btn-primary btn-pill w-100 w-md-auto">
                Cập nhật
              </button>
            </div>
          </div>
        </form>

      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="fragments/footer :: siteFooter"></div>
<script src="/js/Home.js" defer></script>
<script>
  // copy email nhỏ nhỏ
  document.addEventListener('DOMContentLoaded', function () {
    const btn = document.querySelector('.copy-email');
    if (!btn) return;
    btn.addEventListener('click', function () {
      const email = 'du1244567@gmail.com'; // sau này lấy từ data-th-text/currentUser
      navigator.clipboard.writeText(email).then(() => {
        alert('Đã copy email vào clipboard');
      });
    });
  });
</script>

</body>
</html>
