<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh sách đề thi</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/home.css}" />
  </head>
  <body>
    <!-- Header -->
    <div th:replace="fragments/header :: siteHeader"></div>
    <!--Main content-->
    <main class="container">
      <!--Flashcard content-->
      <div id="quiz">
        <!--Left float before content-->
        <div class="float-start">
          <a href="#edit" class="btn btn-outline-primary"> Edit </a>
          <button
            class="btn btn-outline-primary"
            type="button"
            title="Bigger text"
          >
            +
          </button>
          <button
            class="btn btn-outline-primary"
            type="button"
            title="Smaller text"
          >
            -
          </button>
        </div>
        <!--Right float before content-->
        <div class="float-end">
          <span class="count new">0</span>
          <span class="count learn">0</span>
          <span class="count review">0</span>
        </div>

        <div style="clear: both" class="pt-1"></div>
        <div>
          <div>Content</div>
        </div>
      </div>

      <!--Show answer button-->
      <div class="row justify-content-center">
        <div class="col-auto">
          <div class="pt-3"></div>
          <button class="btn btn-primary btn-lg" autofocus="">
            Show Answer
          </button>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Home.js" defer></script>
  </body>
</html>
