<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh sách đề thi</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/home.css}" />
  </head>
  <body>
    <!-- Header -->
    <div th:replace="fragments/header :: siteHeader"></div>
    <!--Main content-->
    <main class="container">
      <div th:each="name, stat : ${deckNames}">
        <div class="row light-bottom-border">
          <!-- First column -->
          <div class="col-7 col-sm-8 col-lg-9">
            <div class="col-7 col-sm-8 col-lg-9">
              <a
                class="btn btn-link"
                th:href="@{/flashcards/start(name=${name})}"
                th:text="${name}"
              >
              </a>
            </div>
          </div>

          <!-- Second column -->
          <div class="col-1">
            <div
              class="number new"
              th:text="${counts[stat.index]}"
              style="color: blue; font-weight: bold"
            ></div>
            <div class="number review" style="color: green; font-weight: bold">
              0
            </div>
          </div>

          <!-- Third column -->
          <div class="col-4 col-sm-3 col-lg-2">
            <div class="dropdown">
              <div style="float: right">
                <button
                  class="btn btn-link dropdown-toggle"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-haspopup="true"
                  aria-expanded="false"
                >
                  Actions
                </button>
                <div class="dropdown-menu">
                  <button
                    class="dropdown-item"
                    type="button"
                    data-bs-toggle="modal"
                    th:data-bs-target="'#RenameModal__' + ${stat.index}"
                  >
                    Rename
                  </button>
                  <!--Shared-->
                  <button
                    class="dropdown-item"
                    type="button"
                    th:onclick="'window.open(\'' + @{/decks/{name}/share(name=${name})} + '\', \'_blank\')'"
                  >
                    Share
                  </button>

                  <button
                    class="dropdown-item delete-deck-btn"
                    type="button"
                    th:data-id="${name}"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col text-center">
          <a href="#shared" class="btn btn-outline-secondary"
            >Get Shared Decks</a
          >
          <button class="btn btn-outline-secondary">Create Deck</button>
        </div>
      </div>

      <!---Modals--->
      <div th:each="name, stat : ${deckNames}">
        <div
          class="modal fade"
          th:id="'RenameModal__' + ${stat.index}"
          tabindex="-1"
          th:attr="aria-labelledby='RenameModalLabel__' + ${stat.index}"
          aria-hidden="true"
        >
          <div class="modal-dialog">
            <div class="modal-content">
              <form th:action="@{/decks/rename}" method="post">
                <div class="modal-header">
                  <h1
                    class="modal-title fs-5"
                    th:id="'RenameModalLabel__' + ${stat.index}"
                  >
                    Deck rename
                  </h1>
                  <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                  ></button>
                </div>
                <div class="modal-body">
                  <input type="hidden" name="oldName" th:value="${name}" />
                  <input
                    type="text"
                    name="newName"
                    class="form-control"
                    th:value="${name}"
                    placeholder="Deck name"
                    aria-label="Deck name"
                    required
                  />
                </div>
                <div class="modal-footer">
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                  >
                    Close
                  </button>
                  <button type="submit" class="btn btn-primary">
                    Save changes
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--Modal-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Home.js" defer></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const saveButtons = document.querySelectorAll(".rename-save-btn");

        saveButtons.forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const modal = e.target.closest(".modal");
            const input = modal.querySelector(".rename-input");
            const newName = input.value.trim();

            if (!newName) {
              alert("Deck name cannot be empty");
              return;
            }

            try {
              const csrfToken =
                document.querySelector('meta[name="_csrf"]').content;
              const csrfHeader = document.querySelector(
                'meta[name="_csrf_header"]'
              ).content;

              const res = await fetch("/decks/rename", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  [csrfHeader]: csrfToken,
                },
                body: JSON.stringify({ deckId, newName }),
              });

              if (!res.ok) {
                const text = await res.text();
                console.error("Server error:", text);
                alert("Failed to rename deck");
                return;
              }

              // Update UI instantly
              const deckLink = document.querySelector(
                `a[href$='?name=${encodeURIComponent(input.value)}']`
              );
              if (deckLink) deckLink.textContent = newName;

              // Close modal
              const bootstrapModal = bootstrap.Modal.getInstance(modal);
              bootstrapModal.hide();
            } catch (err) {
              console.error(err);
              alert("Error updating deck name");
            }
          });
        });
        const deleteButtons = document.querySelectorAll(".delete-deck-btn");

        deleteButtons.forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const deckId = e.target.dataset.id;
            if (!confirm("Are you sure you want to delete this deck?")) return;

            try {
              const res = await fetch(`/decks/${deckId}`, {
                method: "DELETE",
                headers: {
                  "Content-Type": "application/json",
                  "X-CSRF-TOKEN":
                    document.querySelector('meta[name="_csrf"]').content,
                },
              });

              if (res.ok) {
                alert("Deck deleted!");
                // Optionally remove the row from DOM
                e.target.closest(".row").remove();
              } else {
                const text = await res.text();
                alert("Error: " + text);
              }
            } catch (err) {
              console.error(err);
              alert("Delete failed. Check console.");
            }
          });
        });
      });
    </script>
  </body>
</html>
