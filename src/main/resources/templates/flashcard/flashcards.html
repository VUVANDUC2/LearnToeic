<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Danh sách đề thi</title>

    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/home.css}" />
  </head>
  <body>
    <!-- Header -->
    <div th:replace="fragments/header :: siteHeader"></div>
    <!--Main content-->
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">My Decks</h2>
        <div>
          <button
            class="btn btn-outline-secondary me-2"
            data-bs-toggle="modal"
            data-bs-target="#uploadCSVModal"
          >
            <i class="bi bi-download"></i> Get Shared Decks
          </button>
          <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#createDeckModal"
          >
            <i class="bi bi-plus-lg"></i> Create Deck
          </button>
        </div>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" th:each="name, stat : ${deckNames}">
          <div class="card h-100 shadow-sm border-0">
            <div class="card-body d-flex flex-column">
              <div
                class="d-flex justify-content-between align-items-start mb-3"
              >
                <h5
                  class="card-title text-truncate"
                  th:text="${name}"
                  th:title="${name}"
                >
                  Deck Name
                </h5>

                <div class="dropdown">
                  <button
                    class="btn btn-link text-muted p-0 text-decoration-none"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                  >
                    &#8942;
                  </button>
                  <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                      <button
                        class="dropdown-item"
                        type="button"
                        data-bs-toggle="modal"
                        th:data-bs-target="'#RenameModal__' + ${stat.index}"
                      >
                        Rename
                      </button>
                    </li>
                    <li>
                      <button
                        class="dropdown-item"
                        type="button"
                        th:onclick="'window.open(\'' + @{/decks/{name}/share(name=${name})} + '\', \'_blank\')'"
                      >
                        Share
                      </button>
                    </li>
                    <li><hr class="dropdown-divider" /></li>
                    <li>
                      <button
                        class="dropdown-item text-danger delete-deck-btn"
                        type="button"
                        th:data-id="${name}"
                      >
                        Delete
                      </button>
                    </li>
                  </ul>
                </div>
              </div>

              <div class="mt-auto mb-3">
                <div class="d-flex gap-2">
                  <span
                    class="badge bg-primary bg-opacity-10 text-primary border border-primary p-2"
                  >
                    <span th:text="${counts[stat.index]}">0</span> New
                  </span>
                  <span
                    class="badge bg-success bg-opacity-10 text-success border border-success p-2"
                  >
                    0 Review
                  </span>
                </div>
              </div>

              <a
                th:href="@{/flashcards/start(name=${name})}"
                class="btn btn-outline-primary w-100"
              >
                Study Now
              </a>
            </div>
          </div>

          <div
            class="modal fade"
            th:id="'RenameModal__' + ${stat.index}"
            tabindex="-1"
            aria-hidden="true"
          >
            <div class="modal-dialog modal-dialog-centered">
              <div class="modal-content">
                <form th:action="@{/decks/rename}" method="post">
                  <div class="modal-header">
                    <h5 class="modal-title">Rename Deck</h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <input type="hidden" name="oldName" th:value="${name}" />
                    <div class="form-floating">
                      <input
                        type="text"
                        name="newName"
                        class="form-control"
                        th:value="${name}"
                        id="deckNameInput"
                        placeholder="Deck name"
                        required
                      />
                      <label for="deckNameInput">Deck Name</label>
                    </div>
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Cancel
                    </button>
                    <button type="submit" class="btn btn-primary">
                      Save Changes
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!--Modal-->
    <!-- Upload CSV Modal -->
    <!-- Upload CSV Modal -->
    <div
      class="modal fade"
      id="uploadCSVModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Import Shared Deck</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="uploadCSVForm">
              <div class="mb-3">
                <label class="form-label">Deck Name</label>
                <input
                  type="text"
                  id="csvDeckName"
                  class="form-control"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Upload CSV File</label>
                <input
                  type="file"
                  id="csvFile"
                  accept=".csv"
                  class="form-control"
                  required
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" onclick="uploadCSV()">
              Upload
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Create Deck Modal -->
    <div
      class="modal fade"
      id="createDeckModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create New Deck</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="createDeckForm">
              <div class="mb-3">
                <label class="form-label">Deck Name</label>
                <input
                  type="text"
                  id="newDeckName"
                  class="form-control"
                  placeholder="Enter deck name"
                  required
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" onclick="createDeck()">
              Create
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Home.js" defer></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const saveButtons = document.querySelectorAll(".rename-save-btn");

        saveButtons.forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const modal = e.target.closest(".modal");
            const input = modal.querySelector(".rename-input");
            const newName = input.value.trim();

            if (!newName) {
              alert("Deck name cannot be empty");
              return;
            }

            try {
              const csrfToken =
                document.querySelector('meta[name="_csrf"]').content;
              const csrfHeader = document.querySelector(
                'meta[name="_csrf_header"]'
              ).content;

              const res = await fetch("/decks/rename", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  [csrfHeader]: csrfToken,
                },
                body: JSON.stringify({ deckId, newName }),
              });

              if (!res.ok) {
                const text = await res.text();
                console.error("Server error:", text);
                alert("Failed to rename deck");
                return;
              }

              // Update UI instantly
              const deckLink = document.querySelector(
                `a[href$='?name=${encodeURIComponent(input.value)}']`
              );
              if (deckLink) deckLink.textContent = newName;

              // Close modal
              const bootstrapModal = bootstrap.Modal.getInstance(modal);
              bootstrapModal.hide();
            } catch (err) {
              console.error(err);
              alert("Error updating deck name");
            }
          });
        });
        const deleteButtons = document.querySelectorAll(".delete-deck-btn");

        deleteButtons.forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const deckName = e.target.dataset.id;

            if (!confirm("Are you sure you want to delete this deck?")) return;

            try {
              console.log("Deleting deck:", deckName);
              const res = await fetch(
                `/decks/delete?deckName=${encodeURIComponent(deckName)}`,
                {
                  method: "DELETE",
                  headers: {
                    "Content-Type": "application/json",
                    "X-CSRF-TOKEN":
                      document.querySelector('meta[name="_csrf"]').content,
                  },
                }
              );

              if (res.ok) {
                alert("Deck deleted!");
                e.target.closest(".col").remove(); // remove card
              } else {
                const text = await res.text();
                alert("Error: " + text);
              }
            } catch (err) {
              console.error(err);
              alert("Delete failed. Check console.");
            }
          });
        });
      });
    </script>
    <!-- Upload CSV Script -->
    <script>
      async function uploadCSV() {
        const deckName = document.getElementById("csvDeckName").value.trim();
        const fileInput = document.getElementById("csvFile");

        if (!deckName || fileInput.files.length === 0) {
          alert("Please provide deck name and CSV file.");
          return;
        }

        const file = fileInput.files[0];

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        const formData = new FormData();
        formData.append("deckName", deckName);
        formData.append("file", file);

        try {
          const res = await fetch("/decks/upload-csv", {
            method: "POST",
            headers: {
              [csrfHeader]: csrfToken,
            },
            body: formData,
          });

          const text = await res.text();
          console.log("Response:", text);

          if (res.ok && text === "OK") {
            alert("Deck imported successfully!");
            location.reload();
          } else {
            alert("Error: " + text);
          }
        } catch (err) {
          console.error(err);
          alert("Upload failed.");
        }
      }
    </script>

    <!-- Create Deck Script   -->
    <script>
      async function createDeck() {
        const deckName = document.getElementById("newDeckName").value.trim();
        if (!deckName) {
          alert("Deck name cannot be empty!");
          return;
        }

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        try {
          const res = await fetch("/decks/create", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              [csrfHeader]: csrfToken,
            },
            body: JSON.stringify({ deckName: deckName }),
          });

          if (!res.ok) {
            alert("Failed to create deck.");
            return;
          }

          // Close modal
          const modal = bootstrap.Modal.getInstance(
            document.getElementById("createDeckModal")
          );
          modal.hide();

          // Reload to show the new deck
          location.reload();
        } catch (err) {
          console.error(err);
          alert("Error creating deck.");
        }
      }
    </script>
  </body>
</html>
