<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Luyện tập Flashcard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <script th:inline="javascript">
      /*<![CDATA[*/
      window.deckName = /*[[${name}]]*/ "";
      /*]]>*/
    </script>
    <style>
      body {
        background-color: #f0f2f5; /* Màu nền nhẹ nhàng */
        min-height: 100vh;
      }
      .flashcard-container {
        max-width: 800px; /* Giới hạn chiều rộng thẻ để dễ đọc */
        margin: 0 auto;
      }
      .card-content {
        min-height: 300px; /* Chiều cao tối thiểu để thẻ không bị giật khi hiện đáp án */
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      /* Hiệu ứng hover nhẹ cho nút đánh giá */
      .btn-rating {
        transition: transform 0.2s;
        width: 100%; /* Trên mobile sẽ full width */
      }
      .btn-rating:hover {
        transform: translateY(-2px);
      }
      @media (min-width: 768px) {
        .btn-rating {
          width: auto;
          min-width: 100px;
        }
      }
    </style>
  </head>
  <body>
    <div th:replace="~{fragments/header :: siteHeader}"></div>

    <main class="container py-4">
      <div class="flashcard-container mb-4">
        <div
          class="d-flex justify-content-between align-items-center bg-white p-3 rounded shadow-sm"
        >
          <div class="btn-group">
            <a
              href="#"
              class="btn btn-outline-secondary btn-sm"
              title="Chỉnh sửa"
              data-bs-toggle="modal"
              data-bs-target="#EditModal"
            >
              <i class="bi bi-pencil-square"></i> Edit
            </a>
            <button
              class="btn btn-outline-secondary btn-sm"
              id="btn-increase-text"
              title="Tăng cỡ chữ"
            >
              <i class="bi bi-type-h1"></i>+
            </button>
            <button
              class="btn btn-outline-secondary btn-sm"
              id="btn-decrease-text"
              title="Giảm cỡ chữ"
            >
              <i class="bi bi-type"></i>-
            </button>
          </div>

          <div class="d-flex gap-2">
            <span
              class="badge bg-primary bg-opacity-10 text-primary border border-primary"
            >
              New: <span class="count new">0</span>
            </span>
            <span
              class="badge bg-success bg-opacity-10 text-success border border-success"
            >
              Review: <span class="count review">0</span>
            </span>
            <span
              class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary"
            >
              Learn: <span class="count learn">0</span>
            </span>
          </div>
        </div>
      </div>

      <div id="quiz" class="flashcard-container">
        <th:block th:each="flashcard, stat : ${newWords}">
          <div
            class="card flashcard shadow-lg border-0 mb-3"
            th:attr="data-id=${flashcard.flashcardId}"
          >
            <div class="card-body text-center p-5">
              <div class="card-content mb-4">
                <h2
                  class="display-5 fw-bold text-dark content-text"
                  th:text="${flashcard.content}"
                >
                  Content
                </h2>

                <div
                  class="collapse mt-4 border-top pt-4"
                  th:id="'answer-section-' + ${flashcard.flashcardId}"
                >
                  <p
                    class="fs-4 text-muted description-text"
                    th:text="${flashcard.description}"
                  >
                    Description goes here
                  </p>
                </div>
              </div>

              <div class="action-area mt-auto">
                <button
                  class="btn btn-dark btn-lg px-5 rounded-pill btn-show-answer"
                  type="button"
                  th:data-target="'#answer-section-' + ${flashcard.flashcardId}"
                  th:data-controls="'#rating-area-' + ${flashcard.flashcardId}"
                >
                  Show Answer
                </button>

                <div
                  class="d-none justify-content-center gap-2 flex-wrap mt-3"
                  th:id="'rating-area-' + ${flashcard.flashcardId}"
                >
                  <button
                    class="btn btn-outline-danger btn-rating answer-btn"
                    data-value="AGAIN"
                  >
                    <i class="bi bi-arrow-repeat"></i> Again
                  </button>
                  <button
                    class="btn btn-outline-secondary btn-rating answer-btn"
                    data-value="HARD"
                  >
                    Hard
                  </button>
                  <button
                    class="btn btn-outline-primary btn-rating answer-btn"
                    data-value="NORMAL"
                  >
                    Normal
                  </button>
                  <button
                    class="btn btn-outline-success btn-rating answer-btn"
                    data-value="EASY"
                  >
                    Easy
                  </button>
                </div>
              </div>
            </div>
            <div
              class="card-footer text-muted text-end bg-transparent border-0"
            >
              <small>Card <span th:text="${stat.count}"></span> (New)</small>
            </div>
          </div>
        </th:block>

        <th:block th:each="flashcard, stat : ${reviewWords}">
          <div
            class="card flashcard shadow-lg border-0 mb-3"
            th:attr="data-id=${flashcard.flashcardId}"
          >
            <div class="card-body text-center p-5">
              <div class="card-content mb-4">
                <h2
                  class="display-5 fw-bold text-dark content-text"
                  th:text="${flashcard.content}"
                >
                  Content
                </h2>
                <div
                  class="collapse mt-4 border-top pt-4"
                  th:id="'answer-section-review-' + ${flashcard.flashcardId}"
                >
                  <p
                    class="fs-4 text-muted description-text"
                    th:text="${flashcard.description}"
                  >
                    Description
                  </p>
                </div>
              </div>

              <div class="action-area mt-auto">
                <button
                  class="btn btn-dark btn-lg px-5 rounded-pill btn-show-answer"
                  type="button"
                  th:data-target="'#answer-section-review-' + ${flashcard.flashcardId}"
                  th:data-controls="'#rating-area-review-' + ${flashcard.flashcardId}"
                >
                  Show Answer
                </button>

                <div
                  class="d-none justify-content-center gap-2 flex-wrap mt-3"
                  th:id="'rating-area-review-' + ${flashcard.flashcardId}"
                >
                  <button
                    class="btn btn-outline-danger btn-rating answer-btn"
                    data-value="AGAIN"
                  >
                    Again
                  </button>
                  <button
                    class="btn btn-outline-secondary btn-rating answer-btn"
                    data-value="HARD"
                  >
                    Hard
                  </button>
                  <button
                    class="btn btn-outline-primary btn-rating answer-btn"
                    data-value="NORMAL"
                  >
                    Normal
                  </button>
                  <button
                    class="btn btn-outline-success btn-rating answer-btn"
                    data-value="EASY"
                  >
                    Easy
                  </button>
                </div>
              </div>
            </div>
            <div
              class="card-footer text-muted text-end bg-transparent border-0"
            >
              <small>Card <span th:text="${stat.count}"></span> (Review)</small>
            </div>
          </div>
        </th:block>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // 1. Logic cho Flashcards
        const flashcards = document.querySelectorAll(".flashcard");
        let currentIndex = 0;

        // Ẩn tất cả trừ thẻ đầu tiên
        flashcards.forEach((fc, idx) => {
          if (idx !== 0) fc.style.display = "none";
        });

        if (flashcards.length === 0) {
          document.querySelector(
            "#quiz"
          ).innerHTML = `<div class="alert alert-success text-center">Chúc mừng! Bạn đã hoàn thành tất cả thẻ hôm nay.</div>`;
          return;
        }

        // 2. Logic Nút "Show Answer" (Xử lý UI cục bộ)
        document.querySelectorAll(".btn-show-answer").forEach((btn) => {
          btn.addEventListener("click", function () {
            const targetId = this.getAttribute("data-target"); // ID của phần mô tả
            const controlsId = this.getAttribute("data-controls"); // ID của nhóm nút đánh giá

            // Hiện mô tả (sử dụng Bootstrap Collapse API)
            const collapseElement = document.querySelector(targetId);
            const bsCollapse = new bootstrap.Collapse(collapseElement, {
              toggle: true,
            });

            // Ẩn nút "Show Answer" và hiện các nút đánh giá
            this.style.display = "none";
            const ratingArea = document.querySelector(controlsId);
            ratingArea.classList.remove("d-none");
            ratingArea.classList.add("d-flex");
          });
        });

        // 3. Logic Gửi kết quả (Backend)
        const buttons = document.querySelectorAll(".answer-btn");
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        buttons.forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            // Ngăn sự kiện click lan truyền nếu cần thiết
            e.preventDefault();

            const currentCard = flashcards[currentIndex];
            const flashcardId = currentCard.dataset.id;
            // Lấy value từ data attribute, xử lý trường hợp click vào icon bên trong nút
            const targetBtn = e.target.closest(".answer-btn");
            const difficulty = targetBtn.dataset.value;

            try {
              const res = await fetch(
                `/flashcards/update?flashcardId=${flashcardId}&difficulty=${difficulty}`,
                {
                  method: "POST",
                  headers: {
                    [csrfHeader]: csrfToken,
                  },
                }
              );

              if (!res.ok) {
                console.error("Lỗi server:", await res.text());
                alert("Có lỗi xảy ra khi lưu kết quả.");
                return;
              }

              // Chuyển sang thẻ tiếp theo
              currentCard.style.display = "none";
              currentIndex++;

              if (currentIndex < flashcards.length) {
                // Reset trạng thái thẻ tiếp theo (nếu cần thiết, ví dụ đóng collapse lại)
                // Ở đây ta chỉ cần hiện nó ra
                flashcards[currentIndex].style.display = "block";

                // Hoạt ảnh hiện thẻ nhẹ nhàng
                flashcards[currentIndex].classList.add("fade-in");
              } else {
                alert("Hoàn thành bài học!");
                window.location.href = "/flashcards";
              }
            } catch (err) {
              console.error("Lỗi kết nối:", err);
              alert("Không thể kết nối đến máy chủ.");
            }
          });
        });

        // 4. Logic Thay đổi cỡ chữ (Optional)
        let currentFontSize = 1; // rem
        document.getElementById("btn-increase-text").onclick = () => {
          document
            .querySelectorAll(".content-text")
            .forEach((el) => (el.style.fontSize = "3.5rem"));
          document
            .querySelectorAll(".description-text")
            .forEach((el) => (el.style.fontSize = "2rem"));
        };
        document.getElementById("btn-decrease-text").onclick = () => {
          document
            .querySelectorAll(".content-text")
            .forEach((el) => (el.style.fontSize = "1.5rem"));
          document
            .querySelectorAll(".description-text")
            .forEach((el) => (el.style.fontSize = "1rem"));
        };
      });
    </script>

    <!--Modals-->
    <div
      class="modal fade"
      id="EditModal"
      aria-labelledby="EditModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="EditModalLabel">
              Manage Flashcards
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <div class="list-group">
              <div
                class="list-group-item py-3 d-flex align-items-center justify-content-between"
                th:each="card : ${allCards}"
              >
                <!-- LEFT: Checkbox + Content -->
                <div class="d-flex align-items-start">
                  <input
                    class="form-check-input me-3 mt-1"
                    type="checkbox"
                    th:id="'check-' + ${card.flashcardId}"
                    th:value="${card.flashcardId}"
                    name="flashcardIds"
                  />

                  <div>
                    <h6 class="mb-1 fw-semibold" th:text="${card.content}">
                      Card Content
                    </h6>
                    <small class="text-muted" th:text="${card.description}">
                      Card Description
                    </small>
                  </div>
                </div>

                <!-- RIGHT: Edit button -->
                <button
                  class="btn btn-sm btn-outline-primary"
                  type="button"
                  th:data-id="${card.flashcardId}"
                  th:data-content="${card.content}"
                  th:data-description="${card.description}"
                  data-bs-toggle="modal"
                  data-bs-target="#EditCardModal"
                >
                  <i class="bi bi-pencil-square"></i> Edit
                </button>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>

            <!-- CREATE FLASHCARD BUTTON -->
            <button
              type="button"
              class="btn btn-success"
              data-bs-toggle="modal"
              data-bs-target="#CreateFlashcardModal"
            >
              <i class="bi bi-plus-circle"></i> Create Flashcard
            </button>

            <!-- DELETE SELECTED -->
            <button
              type="button"
              class="btn btn-danger"
              onclick="deleteSelectedCards()"
            >
              Delete Selected
            </button>
          </div>
        </div>
      </div>
    </div>

    <!--Second Modal for editing flashcards-->
    <div class="modal fade" id="EditCardModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Flashcard</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <form id="editCardForm">
              <input type="hidden" id="editCardId" />

              <div class="mb-3">
                <label class="form-label">Content</label>
                <input type="text" id="editCardContent" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea
                  id="editCardDescription"
                  class="form-control"
                ></textarea>
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              class="btn btn-secondary"
              data-bs-toggle="modal"
              data-bs-target="#EditModal"
            >
              Cancel
            </button>
            <button
              class="btn btn-primary"
              onclick="saveCardChanges()"
              data-bs-toggle="modal"
              data-bs-target="#EditModal"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--Crweate Flashcards-->
    <div
      class="modal fade"
      id="CreateFlashcardModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Create New Flashcard</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Content</label>
              <input type="text" id="newCardContent" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" id="newCardDescription" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" onclick="createFlashcard()">
              Create
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Attach event listeners to all edit buttons
        document.addEventListener("click", function (e) {
          const btn = e.target.closest("button[data-id]");
          if (!btn) return;

          const id = btn.getAttribute("data-id");
          const content = btn.getAttribute("data-content");
          const description = btn.getAttribute("data-description");

          // Fill modal
          document.getElementById("editCardId").value = id;
          document.getElementById("editCardContent").value = content;
          document.getElementById("editCardDescription").value = description;
        });
      });
      // Update cards
      function saveCardChanges() {
        const id = document.getElementById("editCardId").value;
        const content = document.getElementById("editCardContent").value;
        const description = document.getElementById(
          "editCardDescription"
        ).value;

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        fetch("/flashcards/edit", {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded",
            [csrfHeader]: csrfToken, // <<<< ADD THIS
          },
          body: new URLSearchParams({
            flashcardId: id,
            content: content,
            description: description,
          }),
        })
          .then((response) => response.text())
          .then((data) => {
            if (data === "OK") {
              const modal = bootstrap.Modal.getInstance(
                document.getElementById("EditCardModal")
              );
              modal.hide();

              updateCardUI(id, content, description);
            } else {
              console.error("Server error:", data);
            }
          })
          .catch((err) => console.error(err));
      }

      // Update UI after saving without reload
      function updateCardUI(id, content, description) {
        // Find the list item with correct data-id
        const button = document.querySelector(`button[data-id='${id}']`);
        if (!button) return;

        const parent = button.closest(".list-group-item");

        parent.querySelector("h6").textContent = content;
        parent.querySelector("small").textContent = description;

        // Update button attributes so next edit loads correctly
        button.setAttribute("data-content", content);
        button.setAttribute("data-description", description);
      }
      // Delete selected cards
      function deleteSelectedCards() {
        const checked = [
          ...document.querySelectorAll('input[name="flashcardIds"]:checked'),
        ].map((cb) => cb.value);

        if (checked.length === 0) {
          alert("No cards selected.");
          return;
        }

        if (!confirm(`Delete ${checked.length} card(s)?`)) return;

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        fetch("/flashcards/delete-selected", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            [csrfHeader]: csrfToken,
          },
          body: JSON.stringify(checked),
        })
          .then((res) => res.text())
          .then((data) => {
            if (data === "OK") {
              // Remove deleted items from UI
              checked.forEach((id) => {
                const row = document
                  .querySelector(`#check-${id}`)
                  .closest(".list-group-item");
                row.remove();
              });
            } else {
              console.error("Delete error:", data);
            }
          })
          .catch((err) => console.error(err));
      }
    </script>

    <!--Create Flashcard-->
    <script>
      async function createFlashcard() {
        const content = document.getElementById("newCardContent").value.trim();
        const description = document
          .getElementById("newCardDescription")
          .value.trim();
        if (!content) return alert("Content cannot be empty!");

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        // Use "name" from backend
        const deckName = window.deckName || ""; // fallback in case template doesn't replace

        const res = await fetch("/flashcards/create", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            [csrfHeader]: csrfToken,
          },
          body: JSON.stringify({ content, description, name: deckName }),
        });

        if (res.ok) location.reload();
        else alert("Failed to create flashcard.");
      }
    </script>
  </body>
</html>
