<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <title>Danh sách đề thi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/home.css}" />
  </head>
  <body>
    <div th:replace="fragments/header :: siteHeader"></div>

    <main class="container">
      <div id="quiz">
        <div class="float-start">
          <a href="#edit" class="btn btn-outline-primary"> Edit </a>
          <button
            class="btn btn-outline-primary"
            type="button"
            title="Bigger text"
          >
            +
          </button>
          <button
            class="btn btn-outline-primary"
            type="button"
            title="Smaller text"
          >
            -
          </button>
        </div>

        <div class="float-end">
          <span class="count new">0</span>
          <span class="count learn">0</span>
          <span class="count review">0</span>
        </div>

        <div style="clear: both" class="pt-1"></div>
        <!--New words-->
        <div
          th:each="flashcard, stat : ${newWords}"
          class="flashcard"
          th:attr="data-id=${flashcard.flashcardId}"
        >
          <div class="text-center fs-1" style="background-color: #f8f8f8">
            <div th:text="${flashcard.content}">Content</div>
          </div>

          <div
            class="text-center fs-1 mt-5 collapse"
            th:id="'description-content-' + ${stat.index}"
          >
            <br /><br /><br /><br /><br />
            <div th:text="${flashcard.description}">Description</div>
          </div>

          <div class="text-center" style="margin-top: 100px">
            <button
              class="btn btn-secondary btn-lg"
              data-bs-toggle="collapse"
              th:attr="data-bs-target='#description-content-' + ${stat.index}"
              aria-expanded="false"
              th:attrappend="aria-controls='description-content-' + ${stat.index}"
            >
              Show Answer
            </button>
          </div>
          <br /><br /><br /><br /><br />
          <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-success btn-lg answer-btn" data-value="EASY">
              Easy
            </button>
            <button
              class="btn btn-primary btn-lg answer-btn"
              data-value="NORMAL"
            >
              Normal
            </button>
            <button class="btn btn-danger btn-lg answer-btn" data-value="HARD">
              Hard
            </button>
            <button
              class="btn btn-warning btn-lg answer-btn"
              data-value="AGAIN"
            >
              Again
            </button>
          </div>
        </div>
        <!--Review words-->
        <div
          th:each="flashcard, stat : ${reviewWords}"
          class="flashcard"
          th:attr="data-id=${flashcard.flashcardId}"
        >
          <div class="text-center fs-1" style="background-color: #f8f8f8">
            <div th:text="${flashcard.content}">Content</div>
          </div>

          <div
            class="text-center fs-1 mt-5 collapse"
            th:id="'description-content-' + ${stat.index}"
          >
            <br /><br /><br /><br /><br />
            <div th:text="${flashcard.description}">Description</div>
          </div>

          <div class="text-center" style="margin-top: 100px">
            <button
              class="btn btn-secondary btn-lg"
              data-bs-toggle="collapse"
              th:attr="data-bs-target='#description-content-' + ${stat.index}"
              aria-expanded="false"
              th:attrappend="aria-controls='description-content-' + ${stat.index}"
            >
              Show Answer
            </button>
          </div>
          <br /><br /><br /><br /><br />
          <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-success btn-lg answer-btn" data-value="EASY">
              Easy
            </button>
            <button
              class="btn btn-primary btn-lg answer-btn"
              data-value="NORMAL"
            >
              Normal
            </button>
            <button class="btn btn-danger btn-lg answer-btn" data-value="HARD">
              Hard
            </button>
            <button
              class="btn btn-warning btn-lg answer-btn"
              data-value="AGAIN"
            >
              Again
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/Home.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const buttons = document.querySelectorAll(".answer-btn");

        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector(
          'meta[name="_csrf_header"]'
        ).content;

        console.log("CSRF Token:", csrfToken);
        console.log("CSRF Header:", csrfHeader);

        const flashcards = document.querySelectorAll(".flashcard");
        let currentIndex = 0;

        // Hide all except first
        flashcards.forEach((fc, idx) => {
          if (idx !== 0) fc.style.display = "none";
        });

        buttons.forEach((btn) => {
          btn.addEventListener("click", async (e) => {
            const currentCard = flashcards[currentIndex];
            if (!currentCard) {
              console.error("No current flashcard found!");
              return;
            }

            const flashcardId = currentCard.dataset.id;
            const difficulty = e.target.dataset.value;

            console.log("Clicked difficulty:", difficulty);
            console.log("Flashcard ID:", flashcardId);

            try {
              const res = await fetch(
                `/flashcards/update?flashcardId=${flashcardId}&difficulty=${difficulty}`,
                {
                  method: "POST",
                  headers: {
                    [csrfHeader]: csrfToken,
                  },
                }
              );

              console.log("Server response:", res.status);

              if (!res.ok) {
                console.error("Error response:", await res.text());
                alert("Server error: " + res.status);
                return;
              }
            } catch (err) {
              console.error("Fetch error:", err);
              alert("Fetch failed. Check console.");
              return;
            }

            // Move to next
            currentCard.style.display = "none";
            currentIndex++;

            if (currentIndex < flashcards.length) {
              flashcards[currentIndex].style.display = "block";
              console.log("Showing next card at index:", currentIndex);
            } else {
              console.log("No more flashcards.");
              alert("Done!");
              window.location.href = "/flashcards";
            }
          });
        });
      });
    </script>
  </body>
</html>
